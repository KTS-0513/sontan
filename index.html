<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>尊単 ― 君の英語が、読めるまで</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&icon_names=favorite,lock,volume_up" rel="stylesheet">
<style>
/* =========================================================
   見た目：ノベルゲーム（v0.3・本人が案Bを選んだ）
   場面の背景（夕方・昼・宵・雨の図書室と昇降口）の上に、会話窓・名札・選択肢・システム窓を重ねる
   影・ピル・飾りのアイコンは使わない。背景の光と窓は「場面」として描く（memory: app-ui-not-ai-looking / themed-app-design-embody-theme）
   色は人物（透＝青・陽太＝橙・心の声＝薔薇）と状態（読める＝金・霞む・■■）にだけ使う
   ========================================================= */
:root{
  --ink:#2b2433; --sub:#6f6577; --line:rgba(110,80,100,.22);
  --panel:rgba(255,251,246,.95); --panel-line:rgba(120,80,96,.3);
  --win:rgba(38,30,58,.88); --win-line:rgba(255,214,170,.6); --win-ink:#fff8f0; --win-sub:rgba(255,248,240,.66);
  --gold:#ffd9a8; --peach:#ffecd6; --plum:#4f2c45;
  --toru:#2f5f9e; --yota:#c96a1f; --voice:#c4577a; --voice-ink:#ffd3df; --note:#7d6a58;
  --ok:#2c7a53; --fade:#9b97a3;
  --r:6px;
  --shade:0 1px 6px rgba(70,35,60,.55);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;min-height:100vh;min-height:100dvh}   /* GAS の iframe で高さが0になって真っ白、を防ぐ */
body{color:var(--ink);background:#e9a58f;font-family:'Zen Maru Gothic',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.en{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;width:20px;height:20px;overflow:hidden;vertical-align:-4px;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}

/* ---------- 場面（背景） ---------- */
#scene{position:fixed;inset:0;z-index:-1;overflow:hidden;transition:background .8s}
#scene>*{position:absolute;display:none}
#scene.sc-eve{background:linear-gradient(180deg,#f6d1a8 0%,#eaa892 45%,#bb849b 80%,#8f6f92 100%)}
#scene.sc-day{background:linear-gradient(180deg,#fff2df 0%,#f9e0c8 50%,#efc8b8 100%)}
#scene.sc-dusk{background:linear-gradient(180deg,#f1c4c7 0%,#bd97b9 50%,#857aa9 100%)}
#scene.sc-rain{background:linear-gradient(180deg,#dfe6ee 0%,#b9c6d4 55%,#97a7bb 100%)}
#scene .sash{display:block;top:9vh;right:-3vw;width:min(44vw,380px);height:min(52vh,430px);border:7px solid rgba(255,248,236,.55);border-radius:4px 4px 0 0}
#scene .sash::before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:6px solid rgba(255,248,236,.55)}
#scene .sash::after{content:'';position:absolute;top:45%;left:0;right:0;border-top:6px solid rgba(255,248,236,.55)}
#scene .beam{top:0;height:140vh;background:rgba(255,250,235,.17);transform:rotate(28deg);transform-origin:top}
#scene.sc-eve .beam,#scene.sc-day .beam{display:block}
#scene.sc-day .beam{background:rgba(255,255,255,.28)}
#scene .b1{right:31vw;width:96px}#scene .b2{right:23vw;width:42px}#scene .b3{right:15vw;width:24px}
#scene .shelf{left:0;bottom:20vh;width:min(58vw,560px);height:190px;flex-wrap:wrap;align-content:flex-end;gap:0 2px;padding:0 12px;opacity:.42}
#scene.sc-eve .shelf,#scene.sc-day .shelf,#scene.sc-dusk .shelf{display:flex}
#scene.sc-day .shelf{opacity:.22}
#scene .shelf i{display:block;background:#4a3446;border-radius:1px 1px 0 0;margin-top:8px}
#scene .shelf b{display:block;flex-basis:100%;height:5px;background:#4a3446}
#scene .rain{inset:0;background:repeating-linear-gradient(102deg,transparent 0 26px,rgba(255,255,255,.45) 26px 27px);opacity:.7}
#scene.sc-rain .rain{display:block}
#scene .lamp{top:-20vh;left:-20vw;width:80vw;height:80vh;background:radial-gradient(closest-side,rgba(255,224,170,.55),rgba(255,224,170,0))}
#scene.sc-dusk .lamp{display:block}

/* ---------- 上の帯・タブ ---------- */
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;max-width:820px;margin:0 auto;padding:12px 16px 4px;color:#fff;text-shadow:var(--shade);background:rgba(38,30,58,.55)}
.brand{font-weight:700;font-size:20px;letter-spacing:.14em}
.brand small{font-weight:500;font-size:12px;letter-spacing:.1em;margin-left:10px;opacity:.9}
body.titled .brand{visibility:hidden}
body.titled header.top,body.titled nav.tabs{background:transparent}
.exam{font-size:13px;white-space:nowrap}
.exam b{font-size:17px}
nav.tabs{display:flex;gap:2px;max-width:820px;margin:0 auto;padding:0 16px;border-bottom:1px solid rgba(255,214,170,.6);overflow-x:auto;background:rgba(38,30,58,.55);border-radius:0 0 6px 6px}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;min-height:44px;color:rgba(255,255,255,.88);cursor:pointer;white-space:nowrap;letter-spacing:.1em;text-shadow:var(--shade)}
nav.tabs button.on{color:#fff;border-bottom-color:var(--gold);font-weight:700}
body.focus nav.tabs, body.focus header.top{display:none}
main{max-width:820px;margin:0 auto;padding:16px 16px 120px}
body.focus main{padding-bottom:16px}

/* ---------- システム窓（明るい窓）と文字 ---------- */
.box,.panel,.ch{background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--r);padding:16px;margin:0 0 14px}
h2{font-size:20px;margin:4px 0 8px;line-height:1.5}
h3{font-size:16px;margin:0 0 8px}
.lbl{margin:0;font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.06em}
.note{margin:6px 0;font-size:13px;color:var(--sub)}
.sc-note{margin:8px 0;font-size:13px;color:var(--plum);text-align:center}
.tag{display:inline-block;font-size:11px;line-height:1.6;padding:0 6px;border:1px solid currentColor;border-radius:3px;color:var(--sub);white-space:nowrap;font-weight:700}
.tag.ok{color:var(--ok)} .tag.fade{color:var(--fade);border-style:dashed} .tag.toru{color:var(--toru)} .tag.lock{border:0;padding:0}
.link{background:none;border:0;padding:8px 0;min-height:44px;color:var(--sub);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.spk{background:none;border:0;padding:4px;margin:0 0 0 2px;cursor:pointer;color:var(--sub);vertical-align:middle;min-width:32px;min-height:32px}

/* ---------- ボタン（ゲームの選択肢の形） ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border:1px solid var(--plum);background:var(--plum);color:#fff;border-radius:4px;font-weight:700;cursor:pointer;text-align:center;letter-spacing:.06em}
.btn.ghost{background:transparent;color:var(--plum)}
.btn.wide{display:flex;width:100%;margin-top:10px}
.btn:disabled{opacity:.4;cursor:default}
.btn.vn{background:rgba(38,30,58,.72);border:1px solid rgba(255,255,255,.8);color:#fff;font-weight:700}
.btn.vn:hover:not(:disabled){background:rgba(38,30,58,.9)}
.btn.vn.main{background:var(--peach);color:var(--plum);border-color:#fff}
.btn.vn.main:hover:not(:disabled){background:#fff4e6}
.menu{display:flex;flex-direction:column;gap:10px;max-width:560px;margin:14px auto}
.menu .btn{width:100%;min-height:56px;flex-direction:column;gap:0;line-height:1.4}
.m-k{font-size:11px;letter-spacing:.2em;opacity:.75}

/* ---------- 会話窓（暗い窓）・名札 ---------- */
.win{position:relative;background:var(--win);border:1px solid var(--win-line);border-radius:8px;color:var(--win-ink);padding:22px 18px 18px;margin:20px 0 12px}
.win p{margin:0}
.win .name{position:absolute;top:-14px;left:14px;padding:2px 16px;font-size:13px;font-weight:700;letter-spacing:.15em;border-radius:4px;border:1px solid rgba(255,255,255,.65);background:#6b5a7a;color:#fff}
.name.toru{background:var(--toru)} .name.yota{background:var(--yota)} .name.voice{background:var(--voice)} .name.note{background:var(--note)} .name.alt{background:#4f8a6b}
.win .en{font-size:24px;font-weight:600;line-height:1.35;margin:0 0 8px}
.win .hw{color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.win .ja{font-size:16px}
.win .v,.v{color:var(--voice-ink)}
.win .cant{color:var(--win-sub);font-size:12px;margin:8px 0 0}
.win .next{position:absolute;right:14px;bottom:6px;font-size:12px;animation:blink 1.2s infinite}
.win .spk{color:rgba(255,255,255,.75)}
.win .note{color:var(--win-sub)}
@keyframes blink{50%{opacity:.2}}
.slot.unk{color:rgba(255,255,255,.42);cursor:pointer;letter-spacing:-.04em}
.slot.fade{filter:blur(3px);cursor:pointer}
.slot.ok{color:var(--gold)}
.slot.new{animation:glow 2.2s ease-out;text-shadow:0 0 10px rgba(255,200,150,.7)}
@keyframes glow{0%{opacity:0;text-shadow:0 0 26px #fff}50%{opacity:1;text-shadow:0 0 18px #ffd0a0}}
.spark{position:relative;height:0}
.spark span{position:absolute;bottom:0;font-size:15px;color:#fff3d6;opacity:0;animation:rise 2.6s ease-out forwards;pointer-events:none}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-150px) scale(1.15)}}
.pop{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;background:var(--win);border:1px solid var(--win-line);color:#fff;border-radius:4px;padding:6px 18px;font-size:14px;white-space:nowrap;animation:pop .5s ease-out,popout .5s ease-in 1.9s forwards}
@keyframes pop{from{opacity:0;transform:translate(-50%,-10px)}}
@keyframes popout{to{opacity:0}}

/* ---------- タイトル画面（ホーム） ---------- */
.title{text-align:center;color:#fff;text-shadow:0 2px 14px rgba(90,40,70,.5);margin:3vh 0 2vh}
.title h1{font-size:68px;letter-spacing:.24em;margin:0 0 0 .24em;line-height:1.2;font-weight:700}
.title p{margin:2px 0 0;letter-spacing:.32em;font-size:13px}
.gauge{display:flex;align-items:center;gap:10px;max-width:560px;margin:10px auto 0;color:#fff;font-size:12px;font-weight:700;text-shadow:var(--shade)}
.g-bar{flex:1;height:8px;background:rgba(255,255,255,.35);position:relative;border-radius:1px}
.g-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#86a9e6,#ffb47a);transition:width .9s}
.g-heart{position:absolute;top:50%;transform:translate(-50%,-58%);font-size:20px;color:#fff;transition:left .9s}
.dist-num{text-align:center;margin:6px 0 0;font-size:12px;color:#fff;text-shadow:var(--shade)}
.dist-num b{font-size:22px;margin:0 3px}
.dist-num span{display:block;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats div{padding:4px 0;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats .k{display:block;font-size:12px;color:var(--sub)}
.stats b{font-size:22px}
.plan{font-size:13px;color:var(--sub);margin:10px 0 0;padding-top:8px;border-top:1px solid var(--line)}

/* ---------- 物語の一覧（チャプター選択） ---------- */
.ch h3{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--plum);padding-bottom:4px;margin-bottom:0}
.ch h3 .no{font-size:12px;letter-spacing:.14em;color:var(--sub)}
.ch.off{opacity:.78}
.ch.off h3{color:var(--fade);border-bottom-color:var(--line)}
.ch .meta{font-size:12px;color:var(--sub);margin:4px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.row:hover:not(:disabled){background:rgba(255,236,214,.6)}
.row:disabled{color:var(--fade);cursor:default}
.row .sub{font-size:12px;color:var(--sub)}
.warn{font-size:14px;margin:0 0 14px;padding:10px 12px;border:1px solid var(--voice);border-radius:var(--r);color:var(--voice);background:var(--panel)}

/* ---------- 読む（ノベルゲーム） ---------- */
.q-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#fff;text-shadow:var(--shade);letter-spacing:.1em;background:rgba(38,30,58,.6);border-radius:4px;padding:0 10px;margin:0 0 6px}
.q-head .link{color:#fff;text-decoration:none;letter-spacing:.18em;padding:8px 4px}
.q-head .ttl{font-weight:700;text-align:center;flex:1}
.q-head .cnt{min-width:4em;text-align:right}
.prog{height:3px;background:rgba(255,255,255,.35);margin:0 0 14px}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.rd{min-height:calc(100vh - 32px);display:flex;flex-direction:column}
.rd-stage{flex:1;display:flex;flex-direction:column;justify-content:center;cursor:pointer;min-height:120px}
.rd-msg{position:sticky;bottom:0;padding-bottom:6px;cursor:pointer}
.rd-msg .win{min-height:150px}
.recall-k{text-align:center;color:#fff;letter-spacing:.4em;font-size:13px;text-shadow:var(--shade)}

/* ---------- キュンと要所（v0.7）。キュンの見せ方は見本3案から本人が「a 寄り」を選んだ（b 鼓動・c 間は消した） ---------- */
.material-symbols-outlined.fill{font-variation-settings:'FILL' 1}
.win.big p{font-size:26px;font-weight:700;line-height:1.55;letter-spacing:.03em}
.win.big .en{font-size:32px}
.win.big .ja{font-size:21px}
.win.big{animation:bigin .7s ease-out}
@keyframes bigin{from{opacity:.2;transform:translateY(6px)}}
.win .ky-cant{color:var(--voice-ink)}
.win .ky-cant .material-symbols-outlined,.kyn .material-symbols-outlined,.ky-row .material-symbols-outlined,.ky-pop .material-symbols-outlined{font-size:16px;width:16px;height:16px;vertical-align:-3px}
.rd.kyon::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(255,190,210,0) 35%,rgba(255,120,165,.38) 100%);animation:kywash 1.2s ease-out}
.rd.kyon2::before{background:radial-gradient(ellipse at 50% 55%,rgba(255,200,220,.14) 25%,rgba(255,105,155,.52) 100%)}
@keyframes kywash{from{opacity:0}}
.hearts{position:relative;height:0}
.hearts span{position:absolute;bottom:0;color:#ffc2d6;opacity:0;animation:rise 3s ease-out forwards;pointer-events:none}
.ky-pop{top:58px;border-color:#ff9fc0}   /* 読む画面の上の帯（題名）にかぶらない高さ */
.ky-pop .material-symbols-outlined{color:#ff9fc0}
/* 寄り：ステージの真ん中に、そのセリフ（訳）を大きく */
.kyA{text-align:center;color:#fff;text-shadow:0 2px 10px rgba(60,10,40,.6);max-width:720px;width:100%;margin:0 auto;padding:18px 28px;background:linear-gradient(90deg,transparent,rgba(74,26,62,.66) 14%,rgba(74,26,62,.66) 86%,transparent);animation:kyzoom .9s cubic-bezier(.2,.8,.2,1)}   /* 明るい場面でも読めるように、うしろに暗い帯 */
.kyA .who{font-size:13px;letter-spacing:.3em;margin:0 0 8px}
.kyA .big-ja{font-size:30px;font-weight:700;line-height:1.5;margin:0}
.kyA .big-ja .slot.ok{color:#fff3c9}
.kyA.lv2 .big-ja{font-size:36px}
@keyframes kyzoom{from{opacity:0;transform:scale(.86);letter-spacing:.2em}}
/* 物語の一覧・おわり・LOG のキュン */
.kyn{font-size:12px;color:var(--voice);margin-left:6px;white-space:nowrap}
.ky-row{color:var(--voice);margin:0 0 12px;font-size:14px}
.log-ky{color:#ff9fc0;font-size:14px;width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.log-big{font-size:18px;font-weight:600}
.gate,.end{cursor:auto;max-width:560px;width:100%;margin:0 auto}
.gate-words{font-size:20px;color:var(--toru);margin:6px 0}
.log{position:fixed;inset:0;z-index:10;background:rgba(30,24,46,.94);overflow:auto;cursor:auto}
.log-in{max-width:760px;margin:0 auto;padding:18px 16px 40px;color:var(--win-ink)}
.log-t{font-size:12px;letter-spacing:.3em;color:var(--gold);margin:0 0 12px}
.log-in p{margin:0 0 10px}
.log-n{color:var(--win-ink)} .log-v{color:var(--voice-ink)}
.log-s b,.log-e b{display:inline-block;min-width:3em;font-size:12px;margin-right:6px}
b.toru{color:#9cc0f2} b.yota{color:#ffb67a} b.note{color:#d9c2a6} b.alt{color:#a6dcbd}
.log-e{border-left:2px solid rgba(255,214,170,.5);padding-left:10px;margin:0 0 12px}
.log-e .en{font-size:19px;color:#fff;margin:0}
.log-e .hw{color:var(--gold)}
.log-gate{text-align:center;font-size:12px;color:var(--win-sub)}

/* ---------- 覚える・問題 ---------- */
.card{padding:20px 18px}
.c-en{font-size:42px;margin:0;line-height:1.25;font-weight:600}
.c-ja{margin:4px 0 0;font-size:18px}
.win .ex{font-size:20px;line-height:1.5;color:#fff;margin:0 0 4px}
.win .ex b{color:var(--gold)}
.win .exja{font-size:15px}
.win .exja b{color:var(--gold);font-weight:700}
.win .tk{margin:10px 0 0;font-size:14px;color:var(--voice-ink)}
.row2{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px}
.row2 .btn{margin:0}
.q-ask{margin:0 0 6px;font-size:14px;color:var(--sub);font-weight:700}
.q-word{font-size:44px;text-align:center;margin:10px 0 8px;line-height:1.3;font-weight:600}
.q-ja{font-size:24px;text-align:center;margin:10px 0 4px;font-weight:700}
.q-ex{font-size:22px;line-height:1.6;margin:10px 0 2px;color:var(--toru);font-weight:600}
.exja{margin:4px 0 0;font-size:15px}
.exja b{font-weight:700}
.panel .exja b{background:linear-gradient(transparent 62%,#f8d3df 62%)}
.blank{display:inline-block;min-width:4.5em;height:1.25em;vertical-align:-.25em;border:1.5px solid var(--ink);border-radius:1px;text-align:center}
.blank.sm{min-width:3em;border-width:1px;border-color:var(--sub)}
.choices{display:flex;flex-direction:column;gap:10px;max-width:600px;margin:16px auto 0}
.choice{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 16px;border:1px solid rgba(255,255,255,.8);background:rgba(38,30,58,.72);color:#fff;border-radius:4px;text-align:left;cursor:pointer}
.choice:hover:not(:disabled){background:rgba(38,30,58,.9)}
.choice .k{font-size:12px;color:rgba(255,255,255,.65);min-width:1em}
.choice.en{font-size:20px;font-weight:600}
.choice.right{background:var(--peach);color:var(--plum);border-color:#fff;font-weight:700}
.choice.right .k{color:var(--plum)}
.choice.wrong{opacity:.6}
.choice .tag{color:inherit}
.choice:disabled{cursor:default}
.fb-r{font-weight:700;font-size:17px;margin:0 0 6px!important}
.fb.ok .fb-r{color:var(--gold)}
.fb-a{margin:0 0 6px!important}
.fb-a .en{font-size:24px;color:var(--gold)}
.fb-w{margin:8px 0!important}
.fb-w .en{font-size:22px;font-weight:600;color:var(--gold)}
.pos{font-size:12px;opacity:.75;margin:0 6px}
.fb hr{border:0;border-top:1px solid rgba(255,255,255,.2);margin:10px 0}
.letters{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.lt{display:inline-flex;align-items:flex-end;justify-content:center;width:30px;height:38px;border-bottom:2px solid var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:600}
.attempt{text-align:center;font-size:20px;letter-spacing:.08em;margin:6px 0 0;font-family:'Zen Maru Gothic',sans-serif}
.m{color:var(--ok);text-decoration:underline;text-underline-offset:4px}
.spell-msg{text-align:center;font-size:13px;color:var(--sub);margin:4px 0}
.spell{display:flex;gap:8px;margin:12px 0 0}

/* =========================================================
   [S3] Store：記録はこの端末の localStorage だけ（個人情報は持たない）
   ========================================================= */
const KEY = 'sontan.v1';
const DEFAULT = () => ({ v: 1, words: {}, eps: {}, chs: {}, log: {}, fs: {}, ky: {}, set: { exam: '2027-03-03', tts: true, rate: 0.9, tk: true, voice: false } });
let S = DEFAULT();
let canSave = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    S = Object.assign(DEFAULT(), d);
    S.set = Object.assign(DEFAULT().set, d.set || {});
  } catch (e) { console.warn('記録を読めなかった', e); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (canSave) { canSave = false; toast('この端末では記録が残せない設定になっている'); console.warn('保存できない', e); } }
}
/** 単語ごとの記録（s=段階 0未習/1うろ覚え/2〜7, due=次の復習, ok/ng=はじめの答えの正誤） */
const ws = id => S.words[id] || (S.words[id] = { s: 0, due: 0, ok: 0, ng: 0, last: 0 });
const epSt = ep => S.eps[ep.id] || { pos: 0, learned: false, done: false };
const epW = ep => S.eps[ep.id] || (S.eps[ep.id] = { pos: 0, learned: false, done: false });
const today = () => S.log[ymd(now())] || (S.log[ymd(now())] = { n: 0, r: 0, ok: 0, ng: 0 });
const chCleared = c => !!(S.chs[c.id] && S.chs[c.id].cleared);
function chUnlocked(c) { if (DEV) return !!c.eps; const i = CHAPTERS.indexOf(c); if (i === 0) return true; const p = CHAPTERS[i - 1]; return !!p.eps && chCleared(p); }
function epUnlocked(ep) { if (DEV) return true; const c = ep.ch; if (!chUnlocked(c)) return false; const i = c.eps.indexOf(ep); return i === 0 || epSt(c.eps[i - 1]).done; }
const chTestReady = c => !!c.eps && c.eps.every(ep => epSt(ep).done);
const chName = c => `第${c.no}章`;
const epNo = ep => ep.ch.eps.indexOf(ep) + 1;

/* =========================================================
   [S4] 記憶の段階（間隔反復）
   ---------------------------------------------------------
   段階 2 → 1日後、3 → 3日後、4 → 7日後、5 → 14日後、6 → 30日後、7（殿堂入り）→ 60日後
   はじめの答えが正解 → 段階が1つ上がる（復習の日が来ている語だけ）
   まちがい → 段階1（うろ覚え）に戻り、物語の訳がまた ■■ になる。同じ回で直せたら段階2
   訳の見え方：段階2以上で日が来ていない＝読める／日が来た＝霞む／段階1以下＝読めない
   ========================================================= */
const IVL = { 2: 1, 3: 3, 4: 7, 5: 14, 6: 30, 7: 60 };
const isDue = st => st.s >= 1 && st.due <= now();
const dueAt = s => (s <= 1 ? now() : dayStart(now()) + IVL[s] * DAY);
function setStage(id, s) { const st = ws(id); st.s = s; st.due = dueAt(s); st.last = now(); }
function tally(id, ok) { const st = ws(id); const t = today(); if (ok) { st.ok++; t.ok++; } else { st.ng++; t.ng++; } }
const SRS = {
  learned(id) { setStage(id, 2); },
  ok(id) { tally(id, true); const st = ws(id); if (st.s <= 1) setStage(id, 2); else if (isDue(st)) setStage(id, Math.min(7, st.s + 1)); },
  ng(id) { tally(id, false); setStage(id, 1); },
  relearn(id) { if (ws(id).s <= 1) setStage(id, 2); },
  vis(id) { if (DEV) return 'ok'; const st = S.words[id]; if (!st || st.s < 2) return 'unk'; return isDue(st) ? 'fade' : 'ok'; },
  due() { return WORDS.filter(w => S.words[w.id] && isDue(S.words[w.id])).sort((a, b) => S.words[a.id].due - S.words[b.id].due); },
};
const lockedNow = () => SRS.due().length >= LOCK_DUE;
const learnedCount = () => WORDS.filter(w => (S.words[w.id] || {}).s >= 2).length;
const clearCount = () => WORDS.filter(w => SRS.vis(w.id) === 'ok').length;
/** ふたりの距離（m）：読める語が増えるほど縮み、霞むと開く */
const distance = () => 10 * (1 - clearCount() / WORDS.length);
function stageTag(id) {
  const st = S.words[id]; if (!st || st.s < 1) return '';
  if (st.s >= 2 && isDue(st)) return '<span class="tag fade">霞んでいる</span>';
  if (st.s === 1) return '<span class="tag">うろ覚え</span>';
  if (st.s <= 3) return '<span class="tag toru">覚えたて</span>';
  if (st.s <= 6) return '<span class="tag ok">定着</span>';
  return '<span class="tag ok">殿堂入り</span>';
}
function streak() {
  const active = k => { const l = S.log[k]; return !!l && (l.n + l.r) > 0; };
  let d = dayStart(now()); if (!active(ymd(d))) d -= DAY;
  let n = 0; while (active(ymd(d))) { n++; d -= DAY; }
  return n;
}
function daysLeft() {
  const t = new Date(S.set.exam + 'T00:00:00').getTime();
  return isNaN(t) ? -1 : Math.round((t - dayStart(now())) / DAY);
}

/* =========================================================
   [S5] 読み上げ
   ---------------------------------------------------------
   1. 音声ファイルを先に使う（audio/index.js の対応表。tools/make_audio.mjs が Mac の声で作る）。どの端末でも同じ声が鳴る
   2. ファイルが無い文だけ、ブラウザの読み上げ（Web Speech）に回す。遊び用の声（Albert・Bubbles など）は選ばない。
      3秒たっても始まらなければ止めて知らせる（Claude のアプリの中のブラウザでは始まらなかった・2026-10-27）
   声：単語＝アメリカ英語／透の英語・例文・日記＝イギリス英語（男声）／陽太の英語＝アメリカ英語（男声）
   ========================================================= */
const ODD_VOICE = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Wobble|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Zarvox|Fred|Junior|Kathy|Ralph|Grandma|Grandpa)\b/;
const GOOD_VOICE = /^(Samantha|Alex|Daniel|Karen|Moira|Tessa|Serena|Allison|Ava|Tom|Arthur|Martha|Google (US|UK) English|Microsoft (Aria|Jenny|Guy|Libby|Ryan|Sonia))/;
const TTS = {
  ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
  voices: [],
  init() { if (!this.ok) return; const load = () => { this.voices = speechSynthesis.getVoices() || []; }; load(); speechSynthesis.onvoiceschanged = load; },
  files() { return window.AUDIO_INDEX || null; },
  available() { return !!this.files() || this.ok; },
  can() { return !!S.set.tts && this.available(); },
  tag(who) { return who === 'toru' || who === 'note' ? 'uk' : who === 'yota' ? 'usm' : 'us'; },
  /** 端末の声を選ぶ：同じ言語のよい声 → 英語のよい声 → 同じ言語の声（遊び用の声は除く） */
  voice(lang) {
    const en = this.voices.filter(v => /^en[-_]/i.test(v.lang) && !ODD_VOICE.test(v.name));
    const same = en.filter(v => v.lang.replace('_', '-') === lang);
    return same.find(v => GOOD_VOICE.test(v.name)) || en.find(v => GOOD_VOICE.test(v.name)) || same[0] || en[0] || null;
  },
  say(text, who) {
    if (!S.set.tts || !text) return;
    const f = this.files() && this.files()[`${this.tag(who)}|${text}`];
    if (f) return this.play('audio/' + f);
    this.speak(text, who);
  },
  /** 音声ファイルを鳴らす（1つの audio を使い回す。iPhone でも最初に押したときから鳴るように） */
  play(src, report) {
    this.stop();
    const a = this.el || (this.el = new Audio());
    a.src = src;
    a.playbackRate = (Number(S.set.rate) || 0.9) / 0.9;
    a.onplaying = () => report && report('鳴った');
    a.onended = () => report && report(`鳴った（${a.duration.toFixed(1)}秒）`);
    a.onerror = () => { console.warn('音声ファイルを読めない', src); report ? report('ファイルを読めなかった') : this.speakFallback(src); };
    const p = a.play();
    if (p && p.catch) p.catch(e => { console.warn('音声ファイルを鳴らせない', src, e && e.name); if (report) report(`鳴らせなかった（${e && e.name}）`); else this.warnOnce('音声を鳴らせなかった。端末の音量と消音のスイッチを確かめてね'); });
  },
  speakFallback() { this.warnOnce('音声ファイルが見つからない。端末の読み上げに切り替える'); },
  /** ブラウザの読み上げ。始まらなければ3秒で止めて知らせる */
  speak(text, who, report) {
    if (!this.ok) { if (report) report('この端末には読み上げの機能がない'); else this.warnOnce('この端末では読み上げが使えない'); return; }
    try {
      const busy = speechSynthesis.speaking || speechSynthesis.pending;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = this.voice(who === 'toru' || who === 'note' ? 'en-GB' : 'en-US');
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      u.rate = Number(S.set.rate) || 0.9;
      let started = false;
      u.onstart = () => { started = true; if (report) report(`始まった（声：${v ? v.name : '端末の標準'}）`); else if (!S.audioTest || /^自動/.test(S.audioTest)) { S.audioTest = `自動：読み上げできた（声：${v ? v.name : '端末の標準'}・声の数 ${this.voices.length}）`; save(); } };
      u.onend = () => { if (report && started) report(`読み終わった（声：${v ? v.name : '端末の標準'}）`); };

      if (busy) setTimeout(go, 80); else go();   // 止めた直後に話させると、Chrome では落ちることがある
      clearTimeout(this.wd);

        if (started || this.u !== u) return;
        speechSynthesis.cancel();

  warnOnce(msg) { if (this.warned) return; this.warned = true; toast(msg); },

  const lines = bonus ? bonus.lines : ep.lines;
  const kkey = bonus ? bonus.ch.id + '-bonus' : ep.id;
  const title = bonus ? `${chName(bonus.ch)} ${bonus.title}` : `${chName(ep.ch)} 第${epNo(ep)}話「${ep.title}」`;
  const st = ep ? epW(ep) : null;
  const done0 = !!(st && st.done);
  const newIds = new Set(fresh || []);
  const gateAt = lines.findIndex(L => L.k === 'gate');
  // pos＝出した行の数（いま会話窓にあるのは lines[pos-1]）。読み終えた話は頭から読み返す
  let pos = bonus || (done0 && !fresh) ? 1 : Math.max(1, st.pos);
  // 関門から戻ったら、関門の前の英語のセリフを全部「回想」でもう一度出す。今度は訳が読める（キュンもここで受け取れる）
  let recall = null, rq = [];
  if (fresh && gateAt >= 0) {
    rq = lines.slice(0, gateAt).map((L, k) => (L.k === 'e' ? k : -1)).filter(k => k >= 0);
    recall = rq.length ? rq.shift() : null;
    pos = Math.max(pos, gateAt);
  }
  let showLog = false, sparkled = false, fxAt = -1;
  const curLine = () => (recall !== null ? lines[recall] : lines[pos - 1]);
  const kyNow = () => { const L = curLine(); return !!(L && L.ky && kyReadable(L)); };
  const learned = () => DEV || !st || st.learned;
  function keep() { if (!st) return; st.pos = Math.max(st.pos, pos); if (pos >= lines.length) st.done = true; save(); }
  keep();
  const atGate = () => recall === null && lines[pos] && lines[pos].k === 'gate' && !learned();
  const atEnd = () => recall === null && pos >= lines.length;
  function voice() { const L = curLine(); if (S.set.voice && L && L.k === 'e') TTS.say(plain(L.en), L.w); }
  function adv() {
    if (showLog) return;
    if (recall !== null && rq.length) { recall = rq.shift(); sparkled = false; render(); voice(); return; }
    if (recall !== null) { recall = null; newIds.clear(); pos = Math.min(lines.length, gateAt + 2); keep(); render(); voice(); return; }
    if (atGate() || atEnd()) return;
    const n = lines[pos];
    pos = Math.min(lines.length, pos + (n.k === 'gate' ? 2 : 1));
    keep(); render(); voice();
  }
  function gateHTML() {
    const list = epWords(ep), due = SRS.due().length;
    return `<section class="panel gate">
      <p class="lbl">この先は、英語が分からないと進めない</p>
      <p>■■ のところを訳すには、この${list.length}語を覚えよう。</p>
      <p class="en gate-words">${list.map(w => esc(w.en)).join(' · ')}</p>
      ${due >= LOCK_DUE ? `<p class="note">……の前に。復習がたまっている（${due}語）。</p><button class="btn wide" data-act="review">復習する</button>` : `<button class="btn wide" data-act="learn">${list.length}語を覚える</button>`}
    </section>`;
  }
  /** おわりの画面：この話のキュン（受け取った数） */
  function kyRow() {
    const all = kyLines(lines);
    if (!all.length) return '';
    return `<p class="ky-row">この話のキュン　${all.map(L => kyHeart(kyGot(kkey, L))).join('')}　${kyCount(kkey, lines)}/${all.length}</p>`;
  }
  function endHTML() {
    if (bonus) return `<section class="panel end"><p class="lbl">おまけ おわり</p>${kyRow()}<button class="btn wide" data-act="home">ホームへ</button></section>`;
    const c = ep.ch, i = c.eps.indexOf(ep), nx = c.eps[i + 1];
    let btn = '';
    if (nx) btn = `<button class="btn wide" data-act="openEp" data-arg="${nx.id}">次の話へ</button>`;
    else if (c.test && !chCleared(c)) btn = `<button class="btn wide" data-act="test" data-arg="${c.id}">章末テストへ</button>`;
    else { const nc = CHAPTERS[CHAPTERS.indexOf(c) + 1]; if (nc && nc.eps) btn = `<button class="btn wide" data-act="openEp" data-arg="${nc.eps[0].id}">${chName(nc)}へ</button>`; }
    return `<section class="panel end"><p class="lbl">第${i + 1}話 おわり</p>${kyRow()}${btn}<button class="btn ghost wide" data-act="log">LOG で読み返す</button><button class="btn ghost wide" data-act="home">ホームへ</button></section>`;
  }
  function logHTML() {
    const upto = done0 ? lines.length : pos;
    return `<div class="log"><div class="log-in"><p class="log-t">LOG　${esc(title)}</p>${lines.slice(0, upto).map(logLineHTML).join('')}<button class="btn vn main wide" data-act="closelog">閉じる</button></div></div>`;
  }
  return {
    focus: true, tab: 'story', scene: bonus ? 'day' : ep.bg,
    html() {
      const L = curLine();
      const stop = atGate() || atEnd();
      const ky = kyNow();
      const kyCenter = ky ? kyBigHTML(L) : '';
      let center = '';
      if (recall !== null) center = '<p class="recall-k">― 回想 ―</p>' + kyCenter;
      else if (atGate()) center = gateHTML();
      else if (atEnd()) center = endHTML();
      else center = kyCenter;
      const rdCls = 'rd' + (ky ? ` kyon${L.ky === 2 ? ' kyon2' : ''}` : '');
      return `<div class="${rdCls}">
        <div class="q-head"><button class="link" data-act="home">やめる</button><span class="ttl">${esc(title)}</span><button class="link" data-act="fb">気づいた</button><button class="link" data-act="log">LOG</button></div>
        <div class="rd-stage">${center}</div>
        <div class="rd-msg">${recall !== null ? '<div class="spark" id="spark"></div>' : ''}${ky ? '<div class="hearts" id="hearts"></div>' : ''}${winHTML(L, recall !== null ? newIds : null, stop ? '' : '<span class="next" aria-hidden="true">▼</span>', ky)}</div>
        ${showLog ? logHTML() : ''}
      </div>`;
    },
    where() {
      const L = recall !== null ? lines[recall] : lines[pos - 1];
      const text = L ? (L.k === 'e' ? L.en.replace(/\[([^\]|]+)(?:\|[^\]]+)?\]/g, '$1') : L.t || '') : '';
      return `${title} ${pos}行目：「${text.slice(0, 60)}」`;
    },
    after() {
      if (recall !== null && !sparkled) { sparkled = true; spark(); }
      // キュン：その行を初めて出したときだけ、受け取る・ハートを飛ばす
      const at = recall !== null ? recall : pos - 1;
      if (!showLog && kyNow() && fxAt !== at) {
        fxAt = at;
        const L = curLine();
        if (kyTake(kkey, L)) kyPop(kyCount(kkey, lines), kyLines(lines).length);
        hearts(L.ky === 2 ? 14 : 7);
      }
      if (!showLog) window.scrollTo(0, document.body.scrollHeight);
    },
    act: {
      next: adv,
      learn() { if (lockedNow()) return go('lock'); go('lesson', { ep }); },
      // LOG で読み返したキュンも受け取れる（この版より前に読んだ話のぶん）
      log() { lines.slice(0, done0 ? lines.length : pos).forEach(L => { if (L.ky && kyReadable(L)) kyTake(kkey, L); }); showLog = true; render(); },
      closelog() { showLog = false; render(); },
    },
    tap(e) { if (!showLog && e.target.closest('.rd-stage, .rd-msg') && !e.target.closest('.gate, .end')) adv(); },
    key(e) {
      if (showLog) { if (e.key === 'Escape') { showLog = false; render(); } return; }
      if (['Enter', ' ', 'ArrowDown', 'ArrowRight'].includes(e.key)) { e.preventDefault(); adv(); }
    },
  };
};

/* =========================================================
   [S11] 問題（共通）
   ---------------------------------------------------------
   単語の形式：en2ja 英→意味 / ja2en 意味→英 / cloze 例文の空らん（選ぶ）/ listen 聞いて意味
              write 文の中で書く / pick 語群から選んで書く / dictate 例文を聞いて書く

              lmemo 聞いてメモに書く（2回まで）/ resp 対話の応答を選ぶ（1回だけ）

   書く問題は頭文字なし・綴りの完全一致（北海道の公立入試に合わせる）。ヒントは本人が押したときだけ出す。

const IRREG = { eat: 'ate', choose: 'chose', read: 'read', meet: 'met', speak: 'spoke', understand: 'understood', teach: 'taught', forget: 'forgot', stand: 'stood', write: 'wrote', send: 'sent', make: 'made', come: 'came', go: 'went', have: 'had', see: 'saw', get: 'got', take: 'took', give: 'gave', say: 'said', tell: 'told', think: 'thought', know: 'knew', leave: 'left', find: 'found', feel: 'felt', keep: 'kept', sit: 'sat', run: 'ran', begin: 'began', bring: 'brought', buy: 'bought', catch: 'caught', lose: 'lost', hear: 'heard' };
const S_IRREG = { life: 'lives', child: 'children', man: 'men', woman: 'women', person: 'people', foot: 'feet', tooth: 'teeth', leaf: 'leaves', knife: 'knives', wife: 'wives' };
const ING_IRREG = { forget: 'forgetting', sit: 'sitting', run: 'running', begin: 'beginning', get: 'getting', stop: 'stopping', swim: 'swimming', put: 'putting', plan: 'planning', die: 'dying', lie: 'lying' };
/** 語形を作る（t：s＝3単現・複数／ed＝過去／ing） */
function inflect(b, t) {
  if (t === 's' && S_IRREG[b]) return S_IRREG[b];
  if (t === 's') return /[^aeiou]y$/.test(b) ? b.slice(0, -1) + 'ies' : /(s|sh|ch|x|o)$/.test(b) ? b + 'es' : b + 's';
  if (t === 'ed') return IRREG[b] || (/e$/.test(b) ? b + 'd' : /[^aeiou]y$/.test(b) ? b.slice(0, -1) + 'ied' : b + 'ed');
  if (t === 'ing') return ING_IRREG[b] || (/ie$/.test(b) ? b.slice(0, -2) + 'ying' : /[^aeiou]e$/.test(b) ? b.slice(0, -1) + 'ing' : b + 'ing');
  return b;
}
/** 例文の中の形が、もとの形からどう変わっているか */
function formType(w) {
  const f = exForm(w).toLowerCase(), b = w.en.toLowerCase();
  if (f === b) return 'same';
  for (const t of ['s', 'ed', 'ing']) if (f === inflect(b, t)) return t;
  return 'other';

/** 形式のまとまり（記録の「形式ごとの正答率」） */
const FGROUP = { en2ja: '選ぶ', ja2en: '選ぶ', cloze: '選ぶ', listen: '聞く', dictate: '聞く', lmemo: '聞く', resp: '聞く', write: '書く', pick: '書く', gform: '書く', shiryo: '書く', read: '読む' };
const fkey = it => (it.fmt === 'ny' ? it.ny.t : it.fmt);
/** 復習の形式：段階が上がるほど「書く」へ（道内の受験生は書くが課題：書く 38.5％・R8 分析） */
function fmtFor(id) {
  const s = ws(id).s, tts = TTS.can();
  if (s <= 2) return pick(tts ? ['en2ja', 'listen', 'cloze'] : ['en2ja', 'cloze']);
  if (s === 3) return pick(tts ? ['cloze', 'pick', 'dictate'] : ['cloze', 'pick']);
  if (s === 4) return pick(['pick', 'write', 'ja2en']);
  return pick(tts ? ['write', 'write', 'dictate'] : ['write']);
}
function resolveFmt(f) {
  if (f === 'spell') return 'write';
  if (!TTS.can() && f === 'listen') return 'en2ja';
  if (!TTS.can() && f === 'dictate') return 'write';
  return f;
}
function isNear(a, b) { return NEAR.some(p => p.includes(a) && p.includes(b)); }
function overlaps(a, b) {
  const ta = a.ja.split('、'), tb = b.ja.split('、');
  return ta.some(x => tb.some(y => x.includes(y) || y.includes(x)));
}
/** まぎらわしくない別の語（同じ品詞を先に） */
function distractors(w) {
  const cands = WORDS.filter(x => x.id !== w.id && !isNear(x.id, w.id) && !overlaps(x, w));
  return [...shuffle(cands.filter(x => x.pos === w.pos)), ...shuffle(cands.filter(x => x.pos !== w.pos))];
}
function makeChoices(w, fmt) {
  const key = (fmt === 'en2ja' || fmt === 'listen') ? 'ja' : 'en';
  const out = [], seen = new Set([w[key]]);
  for (const x of distractors(w)) { if (out.length >= 3) break; if (seen.has(x[key])) continue; seen.add(x[key]); out.push(x); }
  return shuffle([{ label: w[key], ok: true }, ...out.map(x => ({ label: x[key], ok: false }))]);
}
/** 語群（大問2問1型）：答えと同じ形にそろえた4語 */
const NO_PLURAL = new Set(['information', 'today', 'tomorrow', 'home', 'rain', 'homework', 'music', 'advice', 'news', 'money', 'english', 'japanese', 'japan', 'one', 'two', 'three', 'lot', 'future', 'people']);
function pickGroup(w) {

  const out = [/^[A-Z]/.test(w.en) ? exForm(w) : form], seen = new Set([form]);   // Japan などは大文字のまま見せる
  // 過去形・ing の語群は動詞からだけ作る（名詞に ed を付けた語を並べない）。複数形にしない語（数えられない名詞・Japan など）は s を付けない

  if (ft === 's') pool = pool.filter(x => !/^[A-Z]/.test(x.en) && !NO_PLURAL.has(x.id));
  for (const x of pool) {
    if (out.length >= 4) break;

const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.。]$/, '');
const blankOf = s => esc(s).replace(/\[[^\]]+\]/, '<span class="blank">　</span>');
const ansOf = s => s.match(/\[([^\]|]+)/)[1];
const maskJa = w => esc(w.exJa).replace(/\{[^}]+\}/, '<span class="blank sm">　</span>');

/** 問題の中身をそろえる：type＝choice（選ぶ）か write（書く）／ask＝指示文／body＝問い／ans＝書く答え／audio＝読み上げる英文 */

    case 'pick': return { type: 'write', ask: '□に入る最も適当な英語1語を、語群から選んで書こう', body: `<p class="q-ex en">${blankOf(w.ex)}</p><p class="exja">${maskJa(w)}</p>${groupHTML(it.group)}`, ans: [exForm(w)] };
    case 'dictate': return { type: 'write', ask: '英文を聞いて、□に入る英語1語を書こう（2回まで）', body: `<p class="q-ex en">${blankOf(w.ex)}</p>`, ans: [exForm(w)], audio: plain(w.ex), who: 'toru', plays: 2 };

function grade(Q, it, ok, first) {
  const id = it.id;

  else if (Q.kind === 'review') { if (first) { ok ? SRS.ok(id) : SRS.ng(id); today().r++; } else if (ok) SRS.relearn(id); }
  else if (Q.kind === 'test' || Q.kind === 'drill') { if (first) { ok ? SRS.ok(id) : SRS.ng(id); if (ok) Q.score++; } }
  if (first) {
    Q.answered++;
    if (!ok) Q.missed.add(id);
    if (Q.kind !== 'practice') { const g = FGROUP[fkey(it)]; const f = S.fs[g] || (S.fs[g] = { ok: 0, ng: 0 }); f[ok ? 'ok' : 'ng']++; }
    if (it.sec) { const s = Q.secs[it.sec] || (Q.secs[it.sec] = { ok: 0, n: 0 }); s.n++; if (ok) s.ok++; }

VIEWS.quiz = Q => {
  Q.i = 0; Q.score = 0; Q.answered = 0; Q.missed = new Set(); Q.secs = {};
  const cur = () => Q.items[Q.i];
  function prepare(it) {
    if (it.ready) return;
    it.ready = true; it.fmt = resolveFmt(it.fmt); it.tries = 0; it.hint = 0; it.plays = 0; it.done = false;
    const w = WMAP[it.id];
    if (it.fmt === 'ny') {
      if (it.ny.t === 'resp') it.choices = shuffle(it.ny.choices.map((label, k) => ({ label, ok: k === it.ny.ans })));
      if (it.ny.t === 'gform') it.group = shuffle(it.ny.g);
    } else if (it.fmt === 'pick') it.group = pickGroup(w);
    else if (['en2ja', 'ja2en', 'cloze', 'listen'].includes(it.fmt)) it.choices = makeChoices(w, it.fmt);
  }
  function audioHTML(it, sp) {
    if (!sp.audio) return '';
    if (!TTS.can()) return `<p class="note">読み上げが使えないので、文字で読む：</p><p class="q-ex en">${esc(sp.audio)}</p>`;
    const left = sp.plays - it.plays;
    const label = sp.plays > 2 ? 'もう一度聞く' : left > 0 ? `放送を聞く（あと${left}回）` : '聞き終わった';
    return `<div class="audio"><button class="btn ghost" data-act="play" id="playBtn" ${left > 0 && !it.done ? '' : 'disabled'}><span class="material-symbols-outlined" aria-hidden="true">volume_up</span> ${label}</button></div>`;
  }
  function choicesHTML(it, sp) {
    return `<div class="choices">${it.choices.map((c, k) => {
      const cls = it.done ? (c.ok ? ' right' : k === it.picked ? ' wrong' : '') : '';
      const mine = it.done && !c.ok && k === it.picked ? ' <span class="tag">えらんだ</span>' : '';
      return `<button class="choice${sp.en ? ' en' : ''}${cls}" data-act="choose" data-arg="${k}" ${it.done ? 'disabled' : ''}><span class="k">${k + 1}</span>${esc(c.label)}${mine}</button>`;
    }).join('')}</div>`;
  }
  function writeHTML(it, sp) {
    const ans = sp.ans[0];
    const boxes = it.hint ? `<div class="letters" aria-hidden="true">${[...ans].map((ch, k) => `<span class="lt">${k < it.hint ? esc(ch) : ''}</span>`).join('')}</div>` : '';
    if (it.done) return boxes;
    let msg = '';
    if (it.tries > 0) {
      const att = [...it.last].map((ch, k) => ch.toLowerCase() === (ans[k] || '').toLowerCase() ? `<span class="m">${esc(ch)}</span>` : esc(ch)).join('');
      msg = `<p class="attempt">${att}</p><p class="spell-msg">線のついた文字は合っている。直して、もう一度。</p>`;
    }
    const hints = [];
    if (it.tries > 0 && it.hint < ans.length) hints.push('<button class="link" data-act="hint">ヒント（1文字見る）</button>');
    if (it.tries >= 3 && it.hint < ans.length) hints.push('<button class="link" data-act="showall">お手本を見る</button>');
    if (sp.meaningBtn) hints.push('<button class="link" data-act="meaning">意味を見る</button>');
    return `${boxes}${msg}<form class="spell" data-form="write"><input id="sp" lang="en" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(it.last || '')}" aria-label="英語で書く"><button class="btn">答える</button></form>
      ${hints.length ? `<p class="hints">${hints.join('')}</p>` : ''}`;
  }
  function fbHTML(w, it, sp) {
    const good = it.ok || it.fixed;
    const r = it.fixed ? '直せた。その調子' : it.ok ? (it.react || pick(REACT.ok)) : pick(REACT.ng);
    const ansLine = sp.type === 'write' ? `<p class="fb-a">答え　<b class="en">${esc(sp.ans[0])}</b></p>` : '';
    const script = sp.audio && it.fmt !== 'listen' ? `<p class="ex en">${esc(sp.audio)}</p>` : '';
    const nyJa = it.fmt === 'ny' ? `<p class="exja">${esc(it.ny.ja)}</p>` : '';
    const card = it.fmt === 'ny'
      ? `<hr><p class="fb-w"><span class="en">${esc(w.en)}</span>${spk(w.en)}<span class="pos">${w.pos}</span>${esc(w.ja)}</p>`
      : `<p class="fb-w"><span class="en">${esc(w.en)}</span>${spk(w.en)}<span class="pos">${w.pos}</span>${esc(w.ja)}</p>
         <p class="ex en">${exHTML(w)} ${spk(plain(w.ex), 'toru')}</p><p class="exja">${exJaHTML(w)}</p>
         ${S.set.tk ? `<p class="tk">（${esc(w.tk)}）</p>` : ''}`;
    return `<div class="win fb ${good ? 'ok' : 'ng'}"><span class="name voice">心の声</span>
      <p class="fb-r">${esc(r)}</p>${ansLine}${script}${nyJa}${card}
      ${!good && Q.requeue && sp.type === 'choice' ? '<p class="note">この単語は、少しあとでもう一度出る。</p>' : ''}
      <button class="btn vn main wide" data-act="next" id="nextBtn">次へ</button>
    </div>`;
  }
  /** 正解の瞬間：上に通知（復習なら距離が縮まる） */
  function cheer(it) {
    it.react = pick(REACT.ok);
    const p = document.createElement('div');
    p.className = 'pop';
    p.textContent = Q.kind === 'review' ? '♡ ふたりの距離が縮まった' : `♡ ${it.react}`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 2500);
  }
  function next() {
    if (!cur().done) return;
    Q.i++;
    if (Q.i >= Q.items.length) return Q.onDone(Q);
    window.scrollTo(0, 0);
    render();
  }
  function choose(k) {
    const it = cur(); if (it.done || !it.choices) return;
    const c = it.choices[Number(k)]; if (!c) return;
    const first = !it.retry && it.tries === 0;
    it.tries++; it.picked = Number(k); it.ok = c.ok; it.done = true;
    grade(Q, it, c.ok, first);
    if (c.ok) cheer(it);
    if (!c.ok && Q.requeue) Q.items.splice(Math.min(Q.items.length, Q.i + 4), 0, { id: it.id, fmt: it.fmt, ny: it.ny, round: it.round, sec: it.sec, retry: true });
    render();
  }
  function write(val) {
    const it = cur(); if (it.done) return;
    const sp = qSpec(it, Q), v = norm(val);
    if (!v) return;
    const first = !it.retry && it.tries === 0;
    const right = sp.ans.some(a => norm(a) === v);
    it.tries++; it.last = String(val).trim();
    grade(Q, it, right, first);
    if (right) { it.done = true; it.ok = first; it.fixed = !first; if (first) cheer(it); }
    render();
  }
  function play() {
    const it = cur(), sp = qSpec(it, Q);
    if (!sp.audio || it.plays >= sp.plays) return;
    it.plays++;
    TTS.say(sp.audio, sp.who);
    const b = $('#playBtn');
    if (b) { const left = sp.plays - it.plays; b.disabled = left <= 0; b.lastChild.textContent = sp.plays > 2 ? ' もう一度聞く' : left > 0 ? ` 放送を聞く（あと${left}回）` : ' 聞き終わった'; }
  }
  const v = {
    focus: true, Q, scene: 'day',
    spec: () => qSpec(cur(), Q),
    where() { const it = cur(); return `${Q.title}${it.sec ? ' ' + it.sec : ''} ${Q.i + 1}問目（${it.id}・${fkey(it)}）`; },
    html() {
      const it = cur(); prepare(it);
      const w = WMAP[it.id], sp = qSpec(it, Q);
      const label = Q.kind === 'lesson' ? (it.round === 1 ? '練習1　意味を選ぶ' : '練習2　例文で選ぶ') : it.sec ? `${Q.title}　${it.sec}` : Q.title;
      let body = `<section class="panel"><p class="q-ask">${esc(sp.ask)}</p>${audioHTML(it, sp)}${sp.body}${sp.type === 'write' ? writeHTML(it, sp) : ''}</section>${sp.type === 'choice' ? choicesHTML(it, sp) : ''}`;
      if (it.done) body += fbHTML(w, it, sp);
      return qHead(label, Q.i + 1, Q.items.length) + body;
    },
    after() {
      const it = cur(), sp = qSpec(it, Q);
      // 何度でも聞ける単語だけ自動で流す。回数が決まった放送は、問いを読んでから本人が押す（本番の下読みと同じ）
      if (sp.audio && sp.plays > 2 && TTS.can() && !it.autoplayed && !it.done) { it.autoplayed = true; play(); }
      if (it.done) { const b = $('#nextBtn'); if (b) b.scrollIntoView({ block: 'nearest' }); }
      else if (sp.type === 'write') { const inp = $('#sp'); if (inp) inp.focus(); }
    },
    act: {
      choose, next, play,
      hint() { const it = cur(); it.hint++; render(); },
      showall() { const it = cur(); it.hint = qSpec(it, Q).ans[0].length; render(); },
      meaning() { cur().showMeaning = true; render(); },
    },
    input(e) { if (e.target.id === 'sp') cur().last = e.target.value; },
    submit() { const inp = $('#sp'); if (inp) write(inp.value); },
    key(e) {
      const it = cur();
      if (e.target && e.target.id === 'sp') return;
      if (!it.done && /^[1-4]$/.test(e.key) && it.choices) { e.preventDefault(); choose(Number(e.key) - 1); }
      else if (it.done && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); next(); }
    },
  };
  return v;
};
VIEWS.result = R => ({
  focus: true, scene: 'eve',
  html() {
    return `<section class="panel result"><h2>${esc(R.title)}</h2>${R.body || ''}</section>
      ${R.voice ? `<div class="win"><span class="name voice">心の声</span><p class="v">${esc(R.voice)}</p></div>` : ''}
      <div class="menu">${R.btns.map((b, k) => `<button class="btn vn${k === 0 ? ' main' : ''}" data-act="rb" data-arg="${k}">${esc(b.label)}</button>`).join('')}</div>`;
  },
  act: { rb(k) { R.btns[Number(k)].fn(); } },
  key(e) { if (e.key === 'Enter') { e.preventDefault(); R.btns[0].fn(); } },
});
function startReview() {
  const due = SRS.due().slice(0, REVIEW_MAX);
  if (!due.length) return toast('いま復習する単語はない');
  const d0 = distance();
  go('quiz', {
    kind: 'review', title: '復習', requeue: true,
    items: shuffle(due).map(w => ({ id: w.id, fmt: fmtFor(w.id) })),
    onDone(Q) {
      const rest = SRS.due().length, d1 = distance();
      const missed = [...Q.missed].map(id => WMAP[id].en);
      go('result', {
        title: `${Q.answered}語、復習した。`,
        voice: '霞んでいた言葉が、戻ってきた。',
        body: `<p>ふたりの距離　${d0.toFixed(1)} m → <b>${d1.toFixed(1)} m</b></p>
          ${missed.length ? `<p class="note">一度まちがえた単語：${missed.join('、')}（明日また出る）</p>` : ''}
          ${rest ? `<p class="note">まだ ${rest}語 残っている。</p>` : ''}`,
        btns: rest ? [{ label: `つづけて復習（${rest}語）`, fn: startReview }, { label: 'ホームへ', fn: () => go('home'), ghost: true }]
                   : [{ label: 'ホームへ', fn: () => go('home') }],
      });
    },
  });
}
/** 入試の形の問題を、章の単語から組み立てる。並びは本番と同じ（聞く → 語と文 → 読む） */
const nyItems = (c, t) => (NYUSHI[c.id] || []).filter(x => x.t === t).map(x => ({ id: x.w, fmt: 'ny', ny: x }));
function buildTest(c) {
  const tts = TTS.can();
  const take = (t, n) => shuffle(nyItems(c, t)).slice(0, n);
  const used = new Set((NYUSHI[c.id] || []).map(x => x.w));
  const pool = shuffle(chWords(c));
  const words = n => {
    const out = pool.filter(w => !used.has(w.id)).slice(0, n);
    while (out.length < n) out.push(pick(pool));
    out.forEach(w => used.add(w.id));
    return out;
  };
  const sec = (label, arr) => arr.map(x => Object.assign(x, { sec: label }));
  return [
    ...sec('大問1 聞く', [...words(2).map(w => ({ id: w.id, fmt: tts ? 'listen' : 'en2ja' })), ...take('resp', 2), ...take('lmemo', 2), ...words(1).map(w => ({ id: w.id, fmt: tts ? 'dictate' : 'write' }))]),
    ...sec('大問2 語と文', [...take('gform', 2), ...words(2).map(w => ({ id: w.id, fmt: 'pick' })), ...take('shiryo', 2)]),
    ...sec('大問3 読む', take('read', 2)),
    ...sec('単語', [...words(2).map(w => ({ id: w.id, fmt: 'en2ja' })), ...words(2).map(w => ({ id: w.id, fmt: 'ja2en' })), ...words(1).map(w => ({ id: w.id, fmt: 'write' }))]),
  ];
}
function secTable(Q) {
  return `<table class="kv">${Object.entries(Q.secs).map(([k, s]) => `<tr><td>${esc(k)}</td><td>${s.ok} / ${s.n}</td></tr>`).join('')}</table>`;
}
function startTest(cid) {
  const c = CHAPTERS.find(x => x.id === cid);
  if (!c || !chTestReady(c)) return toast('全部の話を読むと受けられる');
  const items = buildTest(c);
  go('quiz', {
    kind: 'test', title: `${chName(c)} 章末テスト`, requeue: false, items,
    onDone(Q) {
      const n = items.length, need = Math.ceil(n * PASS_RATE), pass = Q.score >= need;
      const rec = S.chs[c.id] || (S.chs[c.id] = { cleared: false, best: 0, tries: 0 });
      rec.tries++; rec.best = Math.max(rec.best, Q.score); if (pass) rec.cleared = true;
      save();
      const missed = [...Q.missed].map(id => WMAP[id].en);
      const nc = CHAPTERS[CHAPTERS.indexOf(c) + 1];
      const btns = [];
      if (pass && c.bonus) btns.push({ label: `${c.bonus.title}を読む`, fn: () => go('reader', { bonus: c.bonus }) });
      if (pass && nc && nc.eps) btns.push({ label: `${chName(nc)}へ`, fn: () => openEp(nc.eps[0].id), ghost: btns.length > 0 });
      if (!pass) btns.push({ label: '復習する', fn: startReview });
      btns.push({ label: 'ホームへ', fn: () => go('home'), ghost: true });
      go('result', {
        title: pass ? `合格。${Q.score} / ${n}` : `${Q.score} / ${n}。合格は${need}問`,
        voice: pass ? '合格……！ 次の章が、読める。' : '解釈違い……じゃなくて、あと少し。',
        body: `${secTable(Q)}
          ${missed.length ? `<p class="note">まちがえた単語：${missed.join('、')}（復習に回った）</p>` : '<p class="note">全問正解。殿堂入りへの道。</p>'}
          ${!pass ? '<p class="note">まちがえた単語を復習してから、もう一度受けよう。</p>' : ''}`,
        btns,
      });
    },
  });
}
/** 入試の形で練習：その章の入試の形の問題を全部、本番の順で */
function startDrill(cid) {
  const c = CHAPTERS.find(x => x.id === cid);
  if (!c || !chTestReady(c)) return toast('全部の話を読むと解ける');
  const tts = TTS.can();
  const sec = (label, arr) => arr.map(x => Object.assign(x, { sec: label }));
  const items = [
    ...sec('大問1 聞く', [...nyItems(c, 'resp'), ...nyItems(c, 'lmemo')]),
    ...sec('大問2 語と文', [...nyItems(c, 'gform'), ...nyItems(c, 'shiryo')]),
    ...sec('大問3 読む', nyItems(c, 'read')),
  ];
  go('quiz', {
    kind: 'drill', title: `${chName(c)} 入試の形`, requeue: false, items,
    onDone(Q) {
      go('result', {
        title: `${Q.score} / ${items.length}`,
        voice: Q.score === items.length ? '入試の形でも、読める。書ける。尊い。' : '本番は頭文字のヒントがない。綴りまで、もう一歩。',
        body: `${secTable(Q)}${tts ? '' : '<p class="note">この端末は読み上げが使えないので、聞く問題は文字で読んだ。</p>'}
          <p class="note">北海道の公立入試の英語：聞く35点・語と文16点・読む37点・英作文12点（R6〜R8）。</p>`,
        btns: [{ label: 'もう一度', fn: () => startDrill(cid) }, { label: 'ホームへ', fn: () => go('home'), ghost: true }],
      });
    },
  });
}
function startPractice() {
  const list = WORDS.filter(w => { const st = S.words[w.id]; return st && st.s >= 1 && st.ng > 0; })
    .sort((a, b) => S.words[b.id].ng - S.words[a.id].ng).slice(0, 10);
  if (!list.length) return toast('苦手な単語はまだない');
  go('quiz', {
    kind: 'practice', title: '苦手を練習', requeue: true,
    items: shuffle(list).map(w => ({ id: w.id, fmt: pick(['en2ja', 'ja2en', 'cloze', 'pick', 'write']) })),
    onDone() { go('result', { title: 'おつかれさま。', voice: '苦手は、伸びしろ。', body: '<p class="note">練習では記憶の段階は動かない。復習の日に、もう一度確かめよう。</p>', btns: [{ label: '単語帳へ', fn: () => go('words') }, { label: 'ホームへ', fn: () => go('home'), ghost: true }] }); },
  });
}

   ========================================================= */
VIEWS.words = () => {
  let f = 'all', q = '', open = null;
  function listHTML() {
    let list = WORDS.filter(w => (S.words[w.id] || {}).s >= 1);
    if (f === 'fade') list = list.filter(w => SRS.vis(w.id) === 'fade');
    if (f === 'weak') list = list.filter(w => S.words[w.id].ng > 0).sort((a, b) => S.words[b.id].ng - S.words[a.id].ng);
    if (f === 'new') list = list.filter(w => S.words[w.id].s <= 3);
    const qq = q.trim().toLowerCase();
    if (qq) list = list.filter(w => w.en.includes(qq) || w.ja.includes(q.trim()));
    if (!list.length) return '<p class="note">ここに出る単語はまだない。</p>';
    return list.map(w => {
      const st = S.words[w.id];
      const detail = open === w.id ? `<div class="wdetail">
        <p class="ex en">${exHTML(w)} ${spk(plain(w.ex), 'toru')}</p>
        <p class="exja">${exJaHTML(w)}</p>
        ${S.set.tk ? `<p class="tk">（${esc(w.tk)}）</p>` : ''}
        <p class="meta">${w.pos}　正解 ${st.ok}・まちがい ${st.ng}　次の復習 ${st.s >= 2 ? md(st.due) : 'すぐ'}　出てくる話：第${w.ep.replace('-', '章 第')}話</p>
      </div>` : '';
      return `<div class="wrow"><button class="wbtn" data-act="wopen" data-arg="${w.id}"><span class="en">${esc(w.en)}</span><span class="ja">${esc(w.ja)}</span>${stageTag(w.id)}</button>${detail}</div>`;
    }).join('');
  }
  return {
    tab: 'words', scene: 'day',
    html() {
      const met = WORDS.filter(w => (S.words[w.id] || {}).s >= 1).length;
      const weak = WORDS.some(w => (S.words[w.id] || {}).ng > 0 && (S.words[w.id] || {}).s >= 1);
      const tabs = [['all', 'すべて'], ['fade', '霞んでいる'], ['weak', '苦手'], ['new', '覚えたて']]
        .map(([k, l]) => `<button class="${f === k ? 'on' : ''}" data-act="filter" data-arg="${k}">${l}</button>`).join('');
      return `<section class="panel"><p class="note">出会った単語 ${met}語 ／ 収録 ${WORDS.length}語（全体設計 ${PLANNED_TOTAL.toLocaleString()}語）</p>
        <div class="subtabs">${tabs}</div>
        <input class="search" type="search" placeholder="英語か意味でさがす" value="${esc(q)}" aria-label="さがす">
        <div id="wlist">${listHTML()}</div>
        ${weak ? '<button class="btn ghost wide" data-act="practice">苦手を練習する（10語まで）</button>' : ''}</section>`;
    },
    act: {
      filter(k) { f = k; open = null; render(); },
      wopen(id) { open = open === id ? null : id; $('#wlist').innerHTML = listHTML(); },
    },
    input(e) { if (e.target.classList.contains('search')) { q = e.target.value; $('#wlist').innerHTML = listHTML(); } },
  };
};

VIEWS.record = () => ({
  tab: 'record', scene: 'day',
  html() {
    const left = daysLeft(), learned = learnedCount();
    const pace = left > 0 ? Math.ceil(Math.max(0, PLANNED_TOTAL - learned) / left) : 0;
    const cnt = { unk: 0, s1: 0, s2: 0, s4: 0, s7: 0, fade: 0 };
    WORDS.forEach(w => {
      const st = S.words[w.id];
      if (!st || st.s < 1) cnt.unk++;
      else if (st.s >= 2 && isDue(st)) cnt.fade++;
      else if (st.s === 1) cnt.s1++;
      else if (st.s <= 3) cnt.s2++;
      else if (st.s <= 6) cnt.s4++;
      else cnt.s7++;
    });
    const days = [...Array(14)].map((_, k) => dayStart(now()) - (13 - k) * DAY);
    const vals = days.map(d => { const l = S.log[ymd(d)]; return l ? l.n + l.r : 0; });
    const max = Math.max(10, ...vals);
    let ok = 0, ng = 0; WORDS.forEach(w => { const st = S.words[w.id]; if (st) { ok += st.ok; ng += st.ng; } });
    const weak = WORDS.filter(w => (S.words[w.id] || {}).ng > 0).sort((a, b) => S.words[b.id].ng - S.words[a.id].ng).slice(0, 5);
    const chs = CHAPTERS.filter(c => c.eps).map(c => {
      const done = c.eps.filter(ep => epSt(ep).done).length, rec = S.chs[c.id];
      return `<tr><td>${chName(c)}「${esc(c.title)}」</td><td>${done}/${c.eps.length}話　${chCleared(c) ? `合格 ${rec.best}点` : rec ? `最高 ${rec.best}点` : 'テスト前'}</td></tr>`;
    }).join('');

/* =========================================================
   [S15] 検証用の入口（ブラウザのコンソールから）
   TT.lint() データの点検 / TT.shift(日数) 日をずらす / TT.answer(true|false) いまの問題に答える
   ========================================================= */
function lint() {
  const errs = [], ids = new Set();
  const epIndex = id => EPS.findIndex(e => e.id === id);
  WORDS.forEach(w => {
    if (ids.has(w.id)) errs.push(`単語の重複 ${w.id}`); ids.add(w.id);
    if ((w.ex.match(/\[[^\]]+\]/g) || []).length !== 1) errs.push(`${w.id}: 例文の [ ] が1つでない`);
    if ((w.exJa.match(/\{[^}]+\}/g) || []).length !== 1) errs.push(`${w.id}: 例文の訳の { } が1つでない`);
    if (!exForm(w).toLowerCase().startsWith(w.en.slice(0, 2).toLowerCase()) && formType(w) === 'other') errs.push(`${w.id}: 例文の [${exForm(w)}] が単語と合わない？`);
    if (epIndex(w.ep) < 0) errs.push(`${w.id}: 話 ${w.ep} が無い`);
  });
  const check = (lines, where, upto) => lines.forEach((L, i) => {
    if (L.k !== 'e') return;
    const en = [...L.en.matchAll(/\[([^\]|]+)(?:\|([^\]]+))?\]/g)].map(m => (m[2] || m[1]).toLowerCase());
    const ja = [...L.ja.matchAll(/\{([^}|]+)\|[^}]+\}/g)].map(m => m[1]);
    en.forEach(id => {
      if (!WMAP[id]) errs.push(`${where}#${i}: 英文の ${id} が単語に無い`);
      else if (epIndex(WMAP[id].ep) > upto) errs.push(`${where}#${i}: ${id} はこの先の話の単語`);
      if (!ja.includes(id)) errs.push(`${where}#${i}: 訳に ${id} の枠が無い`);
    });
    ja.forEach(id => { if (!en.includes(id)) errs.push(`${where}#${i}: 英文に ${id} の印が無い`); });
  });
  EPS.forEach((ep, k) => {
    const g = ep.lines.filter(L => L.k === 'gate').length;
    if (g !== 1) errs.push(`${ep.id}: ゲートが ${g} 個`);
    if (!epWords(ep).length) errs.push(`${ep.id}: 単語が0`);
    check(ep.lines, ep.id, k);
    const used = new Set(ep.lines.filter(L => L.k === 'e').flatMap(L => [...L.ja.matchAll(/\{([^}|]+)\|/g)].map(m => m[1])));
    epWords(ep).forEach(w => { if (!used.has(w.id)) errs.push(`${ep.id}: ${w.id} が物語に出てこない`); });
  });
  CHAPTERS.filter(c => c.bonus).forEach(c => check(c.bonus.lines, `${c.id}おまけ`, EPS.indexOf(c.eps[c.eps.length - 1])));
  // キュン：どの話にも1つ以上・いちばんの場面（2）は1つだけ・関門には付けない
  [...EPS.map(ep => [ep.id, ep.lines]), ...CHAPTERS.filter(c => c.bonus).map(c => [`${c.id}おまけ`, c.bonus.lines])].forEach(([where, lines]) => {
    if (!kyLines(lines).length) errs.push(`${where}: キュンが0`);
    if (lines.filter(L => L.ky === 2).length !== 1) errs.push(`${where}: いちばんのキュン（2）が1つでない`);
    lines.forEach((L, i) => { if ((L.ky || L.big) && !['n', 'v', 's', 'e'].includes(L.k)) errs.push(`${where}#${i}: キュン・要所の印がセリフでない行に付いている`); });
  });
  Object.entries(NYUSHI).forEach(([cid, list]) => {
    const c = CHAPTERS.find(x => x.id === cid);
    if (!c || !c.eps) { errs.push(`入試の形 ${cid}: 章が無い`); return; }
    list.forEach((n, i) => {
      const where = `入試の形 ${cid}#${i}(${n.t})`;
      if (!WMAP[n.w]) errs.push(`${where}: 単語 ${n.w} が無い`);
      else if (!chWords(c).includes(WMAP[n.w])) errs.push(`${where}: ${n.w} はこの章の単語でない`);
      if (!n.ja) errs.push(`${where}: 訳 ja が無い`);
      if (n.t === 'resp') { if (!Array.isArray(n.choices) || n.choices.length !== 4 || !(n.ans >= 0 && n.ans < 4)) errs.push(`${where}: 選択肢か答えがおかしい`); if (!n.audio) errs.push(`${where}: 放送文が無い`); return; }
      if ((n.q.match(/\[[^\]]+\]/g) || []).length !== 1) { errs.push(`${where}: [ ] が1つでない`); return; }
      const a = ansOf(n.q).toLowerCase();
      if (!a.startsWith(n.w.slice(0, 2))) errs.push(`${where}: 答え ${a} が単語 ${n.w} と合わない？`);
      if (n.t === 'gform' && (n.g.length !== 4 || !n.g.includes(a))) errs.push(`${where}: 語群が4語でないか、答えが無い`);
      if (n.t === 'lmemo' && !n.audio.toLowerCase().includes(a)) errs.push(`${where}: 放送文に答え ${a} が出てこない`);
    });
  });
  WORDS.forEach(w => { const g = pickGroup(w); if (g.length !== 4) errs.push(`${w.id}: 語群が4語そろわない`); });
  return errs;
}
window.TT = {
  get S() { return S; }, WORDS, CHAPTERS, lint,
  view: () => VIEW && VIEW.name,
  shift(days) { TIME_SHIFT += days; go(VIEW && VIEW.focus ? 'home' : (VIEW ? VIEW.name : 'home')); return ymd(now()); },
  q() { if (!VIEW || VIEW.name !== 'quiz') return null; const it = VIEW.Q.items[VIEW.Q.i]; return { id: it.id, fmt: it.fmt, done: it.done, i: VIEW.Q.i, n: VIEW.Q.items.length }; },
  /** いまの画面を1つ進める（問題なら ok で正解/まちがいを答える。答えたあとなら次へ） */
  answer(ok = true) {
    const v = VIEW; if (!v) return null;
    if (v.name === 'quiz') {
      const it = v.Q.items[v.Q.i];
      if (it.done) v.act.next();
      else if (v.spec().type === 'write') { const inp = $('#sp'); inp.value = ok ? v.spec().ans[0] : 'zzz'; v.submit(); }
      else v.act.choose(it.choices.findIndex(c => c.ok === ok));
    } else if (v.name === 'lesson') v.act.cnext();
    else if (v.name === 'reader') { if (v.act.next) v.act.next(); }
    else if (v.name === 'result') v.act.rb(0);
    return v.name;
  },
  /** 正解で n 回進める */
  run(n = 1, ok = true) { let last; for (let k = 0; k < n; k++) last = this.answer(ok); return VIEW.name; },
  reset() { try { localStorage.removeItem(KEY); } catch (e) { /* なにもしない */ } S = DEFAULT(); TIME_SHIFT = 0; go('home'); },
  errors: () => LOGS.filter(l => / error /.test(l)),
};

}
