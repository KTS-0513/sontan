<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>尊単 ― 君の英語が、読めるまで</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&icon_names=agriculture,auto_awesome,bento,book,bookmark,campaign,celebration,chat_bubble,check,checklist,checkroom,compare_arrows,description,directions_railway,directions_run,draft,edit_note,emoji_events,escalator,event,event_seat,favorite,festival,flag,flare,format_list_numbered,gavel,handshake,hiking,home,hourglass_top,how_to_vote,icecream,ink_pen,inventory_2,landscape,lightbulb,local_florist,local_library,lock,luggage,lunch_dining,mail,menu_book,mic,music_note,nights_stay,palette,park,pedal_bike,pets,phishing,photo_album,photo_camera,piano,public,radio,rainy,record_voice_over,recycling,redeem,replay,schedule,school,send,smartphone,soup_kitchen,sports_tennis,sprint,stairs,stars,steps,sticky_note_2,theater_comedy,theaters,train,translate,trending_up,umbrella,volume_up,water_drop,wb_sunny,wb_twilight,weekend,window,workspace_premium" rel="stylesheet">
<style>
/* =========================================================
   見た目：ノベルゲーム（v0.3・本人が案Bを選んだ）
   場面の背景（夕方・昼・宵・雨の図書室と昇降口）の上に、会話窓・名札・選択肢・システム窓を重ねる
   影・ピル・飾りのアイコンは使わない。背景の光と窓は「場面」として描く（memory: app-ui-not-ai-looking / themed-app-design-embody-theme）
   色は人物（透＝青・陽太＝橙・心の声＝薔薇）と状態（読める＝金・霞む・■■）にだけ使う
   ========================================================= */
:root{
  --ink:#2b2433; --sub:#6f6577; --line:rgba(110,80,100,.22);
  --panel:rgba(255,251,246,.95); --panel-line:rgba(120,80,96,.3);
  --win:rgba(38,30,58,.88); --win-line:rgba(255,214,170,.6); --win-ink:#fff8f0; --win-sub:rgba(255,248,240,.66);
  --gold:#ffd9a8; --peach:#ffecd6; --plum:#4f2c45;
  --toru:#2f5f9e; --yota:#c96a1f; --voice:#c4577a; --voice-ink:#ffd3df; --note:#7d6a58;
  --ok:#2c7a53; --fade:#9b97a3;
  --r:6px;
  --shade:0 1px 6px rgba(70,35,60,.55);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;min-height:100vh;min-height:100dvh}   /* GAS の iframe で高さが0になって真っ白、を防ぐ */
body{color:var(--ink);background:#e9a58f;font-family:'Zen Maru Gothic',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.en{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;width:20px;height:20px;overflow:hidden;vertical-align:-4px;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}

/* ---------- 場面（背景） ---------- */
#scene{position:fixed;inset:0;z-index:-1;overflow:hidden;transition:background .8s}
#scene>*{position:absolute;display:none}
#scene.sc-eve{background:linear-gradient(180deg,#f6d1a8 0%,#eaa892 45%,#bb849b 80%,#8f6f92 100%)}
#scene.sc-day{background:linear-gradient(180deg,#fff2df 0%,#f9e0c8 50%,#efc8b8 100%)}
#scene.sc-dusk{background:linear-gradient(180deg,#f1c4c7 0%,#bd97b9 50%,#857aa9 100%)}
#scene.sc-rain{background:linear-gradient(180deg,#dfe6ee 0%,#b9c6d4 55%,#97a7bb 100%)}
#scene.sc-night{background:radial-gradient(circle at 72% 14%,#fff 0 1px,transparent 2px),radial-gradient(circle at 86% 30%,#ffe9c4 0 1px,transparent 2px),radial-gradient(circle at 60% 36%,#fff 0 1px,transparent 2px),radial-gradient(circle at 92% 8%,#fff 0 1px,transparent 2px),linear-gradient(180deg,#1b2046 0%,#272d5c 50%,#3a3a6c 100%)}   /* 夜（v0.9・第3章）：紺の夜空。明るい窓は描かない。文字は会話窓・暗い帯の上に出すので、暗幕は足さない */
#scene .sash{display:block;top:9vh;right:-3vw;width:min(44vw,380px);height:min(52vh,430px);border:7px solid rgba(255,248,236,.55);border-radius:4px 4px 0 0}
#scene .sash::before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:6px solid rgba(255,248,236,.55)}
#scene .sash::after{content:'';position:absolute;top:45%;left:0;right:0;border-top:6px solid rgba(255,248,236,.55)}
#scene .beam{top:0;height:140vh;background:rgba(255,250,235,.17);transform:rotate(28deg);transform-origin:top}
#scene.sc-eve .beam,#scene.sc-day .beam{display:block}
#scene.sc-day .beam{background:rgba(255,255,255,.28)}
#scene .b1{right:31vw;width:96px}#scene .b2{right:23vw;width:42px}#scene .b3{right:15vw;width:24px}
#scene .shelf{left:0;bottom:20vh;width:min(58vw,560px);height:190px;flex-wrap:wrap;align-content:flex-end;gap:0 2px;padding:0 12px;opacity:.42}
#scene.sc-eve .shelf,#scene.sc-day .shelf,#scene.sc-dusk .shelf{display:flex}
#scene.sc-day .shelf{opacity:.22}
#scene .shelf i{display:block;background:#4a3446;border-radius:1px 1px 0 0;margin-top:8px}
#scene .shelf b{display:block;flex-basis:100%;height:5px;background:#4a3446}
#scene .rain{inset:0;background:repeating-linear-gradient(102deg,transparent 0 26px,rgba(255,255,255,.45) 26px 27px);opacity:.7}
#scene.sc-rain .rain{display:block}
#scene .lamp{top:-20vh;left:-20vw;width:80vw;height:80vh;background:radial-gradient(closest-side,rgba(255,224,170,.55),rgba(255,224,170,0))}
#scene.sc-dusk .lamp{display:block}
#scene.sc-night .sash,#scene.sc-night .sash::before,#scene.sc-night .sash::after{border-color:rgba(255,236,200,.24)}
#scene.sc-night .lamp{display:block;opacity:.45}   /* 教室の灯り（夜に残っている、の気配） */

/* ---------- 上の帯・タブ ---------- */
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;max-width:820px;margin:0 auto;padding:12px 16px 4px;color:#fff;text-shadow:var(--shade);background:rgba(38,30,58,.55)}
.brand{font-weight:700;font-size:20px;letter-spacing:.14em}
.brand small{font-weight:500;font-size:12px;letter-spacing:.1em;margin-left:10px;opacity:.9}
body.titled .brand{visibility:hidden}
body.titled header.top,body.titled nav.tabs{background:transparent}
.exam{font-size:13px;white-space:nowrap}
.exam b{font-size:17px}
nav.tabs{display:flex;gap:2px;max-width:820px;margin:0 auto;padding:0 16px;border-bottom:1px solid rgba(255,214,170,.6);overflow-x:auto;background:rgba(38,30,58,.55);border-radius:0 0 6px 6px}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;min-height:44px;color:rgba(255,255,255,.88);cursor:pointer;white-space:nowrap;letter-spacing:.1em;text-shadow:var(--shade)}
nav.tabs button.on{color:#fff;border-bottom-color:var(--gold);font-weight:700}
body.focus nav.tabs, body.focus header.top{display:none}
main{max-width:820px;margin:0 auto;padding:16px 16px 120px}
body.focus main{padding-bottom:16px}

/* ---------- システム窓（明るい窓）と文字 ---------- */
.box,.panel,.ch{background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--r);padding:16px;margin:0 0 14px}
h2{font-size:20px;margin:4px 0 8px;line-height:1.5}
h3{font-size:16px;margin:0 0 8px}
.lbl{margin:0;font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.06em}
.note{margin:6px 0;font-size:13px;color:var(--sub)}
.sc-note{margin:8px 0;font-size:13px;color:var(--plum);text-align:center}
.tag{display:inline-block;font-size:11px;line-height:1.6;padding:0 6px;border:1px solid currentColor;border-radius:3px;color:var(--sub);white-space:nowrap;font-weight:700}
.tag.ok{color:var(--ok)} .tag.fade{color:var(--fade);border-style:dashed} .tag.toru{color:var(--toru)} .tag.lock{border:0;padding:0}
.link{background:none;border:0;padding:8px 0;min-height:44px;color:var(--sub);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.spk{background:none;border:0;padding:4px;margin:0 0 0 2px;cursor:pointer;color:var(--sub);vertical-align:middle;min-width:32px;min-height:32px}

/* ---------- ボタン（ゲームの選択肢の形） ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border:1px solid var(--plum);background:var(--plum);color:#fff;border-radius:4px;font-weight:700;cursor:pointer;text-align:center;letter-spacing:.06em}
.btn.ghost{background:transparent;color:var(--plum)}
.btn.wide{display:flex;width:100%;margin-top:10px}
.btn:disabled{opacity:.4;cursor:default}
.btn.vn{background:rgba(38,30,58,.72);border:1px solid rgba(255,255,255,.8);color:#fff;font-weight:700}
.btn.vn:hover:not(:disabled){background:rgba(38,30,58,.9)}
.btn.vn.main{background:var(--peach);color:var(--plum);border-color:#fff}
.btn.vn.main:hover:not(:disabled){background:#fff4e6}
.menu{display:flex;flex-direction:column;gap:10px;max-width:560px;margin:14px auto}
.menu .btn{width:100%;min-height:56px;flex-direction:column;gap:0;line-height:1.4}
.m-k{font-size:11px;letter-spacing:.2em;opacity:.75}

/* ---------- 会話窓（暗い窓）・名札 ---------- */
.win{position:relative;background:var(--win);border:1px solid var(--win-line);border-radius:8px;color:var(--win-ink);padding:22px 18px 18px;margin:20px 0 12px}
.win p{margin:0}
.win .name{position:absolute;top:-14px;left:14px;padding:2px 16px;font-size:13px;font-weight:700;letter-spacing:.15em;border-radius:4px;border:1px solid rgba(255,255,255,.65);background:#6b5a7a;color:#fff}
.name.toru{background:var(--toru)} .name.yota{background:var(--yota)} .name.voice{background:var(--voice)} .name.note{background:var(--note)} .name.alt{background:#4f8a6b} .name.leo{background:#8a6a3b}
.win .en{font-size:24px;font-weight:600;line-height:1.35;margin:0 0 8px}
.win .hw{color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.win .ja{font-size:16px}
.win .v,.v{color:var(--voice-ink)}
.win .cant{color:var(--win-sub);font-size:12px;margin:8px 0 0}
.win .next{position:absolute;right:14px;bottom:6px;font-size:12px;animation:blink 1.2s infinite}
.win .spk{color:rgba(255,255,255,.75)}
.win .note{color:var(--win-sub)}
@keyframes blink{50%{opacity:.2}}
.slot.unk{color:rgba(255,255,255,.42);cursor:pointer;letter-spacing:-.04em}
.slot.fade{filter:blur(3px);cursor:pointer}
.slot.ok{color:var(--gold)}
.slot.new{animation:glow 2.2s ease-out;text-shadow:0 0 10px rgba(255,200,150,.7)}
@keyframes glow{0%{opacity:0;text-shadow:0 0 26px #fff}50%{opacity:1;text-shadow:0 0 18px #ffd0a0}}
.spark{position:relative;height:0}
.spark span{position:absolute;bottom:0;font-size:15px;color:#fff3d6;opacity:0;animation:rise 2.6s ease-out forwards;pointer-events:none}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-150px) scale(1.15)}}
.pop{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;background:var(--win);border:1px solid var(--win-line);color:#fff;border-radius:4px;padding:6px 18px;font-size:14px;white-space:nowrap;animation:pop .5s ease-out,popout .5s ease-in 1.9s forwards}
@keyframes pop{from{opacity:0;transform:translate(-50%,-10px)}}
@keyframes popout{to{opacity:0}}

/* ---------- タイトル画面（ホーム） ---------- */
.title{text-align:center;color:#fff;text-shadow:0 2px 14px rgba(90,40,70,.5);margin:3vh 0 2vh}
.title h1{font-size:68px;letter-spacing:.24em;margin:0 0 0 .24em;line-height:1.2;font-weight:700}
.title p{margin:2px 0 0;letter-spacing:.32em;font-size:13px}
.gauge{display:flex;align-items:center;gap:10px;max-width:560px;margin:10px auto 0;color:#fff;font-size:12px;font-weight:700;text-shadow:var(--shade)}
.g-bar{flex:1;height:8px;background:rgba(255,255,255,.35);position:relative;border-radius:1px}
.g-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#86a9e6,#ffb47a);transition:width .9s}
.g-heart{position:absolute;top:50%;transform:translate(-50%,-58%);font-size:20px;color:#fff;transition:left .9s}
.dist-num{text-align:center;margin:6px 0 0;font-size:12px;color:#fff;text-shadow:var(--shade)}
.dist-num b{font-size:22px;margin:0 3px}
.dist-num span{display:block;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stats div{padding:4px 0;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats .k{display:block;font-size:12px;color:var(--sub)}
.stats b{font-size:22px}
.plan{font-size:13px;color:var(--sub);margin:10px 0 0;padding-top:8px;border-top:1px solid var(--line)}

/* ---------- 物語の一覧（チャプター選択） ---------- */
.ch h3{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--plum);padding-bottom:4px;margin-bottom:0}
.ch h3 .no{font-size:12px;letter-spacing:.14em;color:var(--sub)}
.ch.off{opacity:.78}
.ch.off h3{color:var(--fade);border-bottom-color:var(--line)}
.ch .meta{font-size:12px;color:var(--sub);margin:4px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.row:hover:not(:disabled){background:rgba(255,236,214,.6)}
.row:disabled{color:var(--fade);cursor:default}
.row .sub{font-size:12px;color:var(--sub)}
.warn{font-size:14px;margin:0 0 14px;padding:10px 12px;border:1px solid var(--voice);border-radius:var(--r);color:var(--voice);background:var(--panel)}

/* ---------- 読む（ノベルゲーム） ---------- */
.q-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#fff;text-shadow:var(--shade);letter-spacing:.1em;background:rgba(38,30,58,.6);border-radius:4px;padding:0 10px;margin:0 0 6px}
.q-head .link{color:#fff;text-decoration:none;letter-spacing:.18em;padding:8px 4px}
.q-head .ttl{font-weight:700;text-align:center;flex:1}
.q-head .cnt{min-width:4em;text-align:right}
.prog{height:3px;background:rgba(255,255,255,.35);margin:0 0 14px}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.rd{min-height:calc(100vh - 32px);display:flex;flex-direction:column}
.rd-stage{flex:1;display:flex;flex-direction:column;justify-content:center;cursor:pointer;min-height:120px}
.rd-msg{position:sticky;bottom:0;padding-bottom:6px;cursor:pointer}
.rd-msg .win{min-height:150px}
.recall-k{text-align:center;color:#fff;letter-spacing:.4em;font-size:13px;text-shadow:var(--shade)}

/* ---------- キュンと要所（v0.7）。キュンの見せ方は見本3案から本人が「a 寄り」を選んだ（b 鼓動・c 間は消した） ---------- */
.material-symbols-outlined.fill{font-variation-settings:'FILL' 1}
.win.big p{font-size:26px;font-weight:700;line-height:1.55;letter-spacing:.03em}
.win.big .en{font-size:32px}
.win.big .ja{font-size:21px}
.win.big .cant{font-size:12px;font-weight:400;letter-spacing:0}   /* 「訳せない……」の注意書きまで大きくしない */
.win.big{animation:bigin .7s ease-out}
@keyframes bigin{from{opacity:.2;transform:translateY(6px)}}
.win .ky-cant{color:var(--voice-ink)}
.win .ky-cant .material-symbols-outlined,.kyn .material-symbols-outlined,.ky-row .material-symbols-outlined,.ky-pop .material-symbols-outlined{font-size:16px;width:16px;height:16px;vertical-align:-3px}
.rd.kyon::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(255,190,210,0) 35%,rgba(255,120,165,.38) 100%);animation:kywash 1.2s ease-out}
.rd.kyon2::before{background:radial-gradient(ellipse at 50% 55%,rgba(255,200,220,.14) 25%,rgba(255,105,155,.52) 100%)}
@keyframes kywash{from{opacity:0}}
.hearts{position:relative;height:0}
.hearts span{position:absolute;bottom:0;color:#ffc2d6;opacity:0;animation:rise 3s ease-out forwards;pointer-events:none}
.ky-pop{top:58px;border-color:#ff9fc0}   /* 読む画面の上の帯（題名）にかぶらない高さ */
.ky-pop .material-symbols-outlined{color:#ff9fc0}
/* 寄り：ステージの真ん中に、そのセリフ（訳）を大きく */
.kyA{text-align:center;color:#fff;text-shadow:0 2px 10px rgba(60,10,40,.6);max-width:720px;width:100%;margin:0 auto;padding:18px 28px;background:linear-gradient(90deg,transparent,rgba(74,26,62,.66) 14%,rgba(74,26,62,.66) 86%,transparent);animation:kyzoom .9s cubic-bezier(.2,.8,.2,1)}   /* 明るい場面でも読めるように、うしろに暗い帯 */
.kyA .who{font-size:13px;letter-spacing:.3em;margin:0 0 8px}
.kyA .big-ja{font-size:30px;font-weight:700;line-height:1.5;margin:0}
.kyA .big-ja .slot.ok{color:#fff3c9}
.kyA.lv2 .big-ja{font-size:36px}
@keyframes kyzoom{from{opacity:0;transform:scale(.86);letter-spacing:.2em}}
/* ---------- 話のはじめの札：いつ・どこと、前回まで（v0.8）。キュンの寄りと同じ「真ん中の暗い帯」 ---------- */
.opening{max-width:600px;width:100%;margin:0 auto;text-align:center;color:#fff;text-shadow:0 1px 8px rgba(40,10,40,.55);padding:20px 32px;background:linear-gradient(90deg,transparent,rgba(46,32,64,.66) 12%,rgba(46,32,64,.66) 88%,transparent);animation:opin .8s ease-out}
.op-no{font-size:12px;letter-spacing:.35em;color:var(--gold);margin:0 0 4px}
.op-title{font-size:26px;font-weight:700;letter-spacing:.08em;margin:0 0 6px}
.op-at{font-size:14px;letter-spacing:.05em;margin:0}
.op-prev{max-width:460px;margin:14px auto 0;padding-top:12px;border-top:1px solid rgba(255,214,170,.45)}
.op-prev .op-lbl{font-size:11px;letter-spacing:.3em;color:var(--gold);margin:0 0 4px}
.op-prev p{font-size:14px;line-height:1.7;margin:0}
@keyframes opin{from{opacity:0;transform:translateY(8px)}}
.log-at{font-size:13px;color:var(--win-sub);margin:-6px 0 14px}
/* 物語の一覧・おわり・LOG のキュン */
.kyn{font-size:12px;color:var(--voice);margin-left:6px;white-space:nowrap}
.ky-row{color:var(--voice);margin:0 0 12px;font-size:14px}
.log-ky{color:#ff9fc0;font-size:14px;width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.log-big{font-size:18px;font-weight:600}
.gate,.end{cursor:auto;max-width:560px;width:100%;margin:0 auto}
.gate-words{font-size:20px;color:var(--toru);margin:6px 0}
.log{position:fixed;inset:0;z-index:10;background:rgba(30,24,46,.94);overflow:auto;cursor:auto}
.log-in{max-width:760px;margin:0 auto;padding:18px 16px 40px;color:var(--win-ink)}
.log-t{font-size:12px;letter-spacing:.3em;color:var(--gold);margin:0 0 12px}
.log-in p{margin:0 0 10px}
.log-n{color:var(--win-ink)} .log-v{color:var(--voice-ink)}
.log-s b,.log-e b{display:inline-block;min-width:3em;font-size:12px;margin-right:6px}
b.toru{color:#9cc0f2} b.yota{color:#ffb67a} b.note{color:#d9c2a6} b.alt{color:#a6dcbd} b.leo{color:#e0c08f}
.log-e{border-left:2px solid rgba(255,214,170,.5);padding-left:10px;margin:0 0 12px}
.log-e .en{font-size:19px;color:#fff;margin:0}
.log-e .hw{color:var(--gold)}
.log-gate{text-align:center;font-size:12px;color:var(--win-sub)}

/* ---------- 覚える・問題 ---------- */
.card{padding:20px 18px}
.c-en{font-size:42px;margin:0;line-height:1.25;font-weight:600}
.c-ja{margin:4px 0 0;font-size:18px}
.win .ex{font-size:20px;line-height:1.5;color:#fff;margin:0 0 4px}
.win .ex b{color:var(--gold)}
.win .exja{font-size:15px}
.win .exja b{color:var(--gold);font-weight:700}
.win .tk{margin:10px 0 0;font-size:14px;color:var(--voice-ink)}
.row2{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px}
.row2 .btn{margin:0}
.q-ask{margin:0 0 6px;font-size:14px;color:var(--sub);font-weight:700}
.q-word{font-size:44px;text-align:center;margin:10px 0 8px;line-height:1.3;font-weight:600}
.q-ja{font-size:24px;text-align:center;margin:10px 0 4px;font-weight:700}
.q-ex{font-size:22px;line-height:1.6;margin:10px 0 2px;color:var(--toru);font-weight:600}
.exja{margin:4px 0 0;font-size:15px}
.exja b{font-weight:700}
.panel .exja b{background:linear-gradient(transparent 62%,#f8d3df 62%)}
.blank{display:inline-block;min-width:4.5em;height:1.25em;vertical-align:-.25em;border:1.5px solid var(--ink);border-radius:1px;text-align:center}
.blank.sm{min-width:3em;border-width:1px;border-color:var(--sub)}
.choices{display:flex;flex-direction:column;gap:10px;max-width:600px;margin:16px auto 0}
.choice{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 16px;border:1px solid rgba(255,255,255,.8);background:rgba(38,30,58,.72);color:#fff;border-radius:4px;text-align:left;cursor:pointer}
.choice:hover:not(:disabled){background:rgba(38,30,58,.9)}
.choice .k{font-size:12px;color:rgba(255,255,255,.65);min-width:1em}
.choice.en{font-size:20px;font-weight:600}
.choice.right{background:var(--peach);color:var(--plum);border-color:#fff;font-weight:700}
.choice.right .k{color:var(--plum)}
.choice.wrong{opacity:.6}
.choice .tag{color:inherit}
.choice:disabled{cursor:default}
.fb-r{font-weight:700;font-size:17px;margin:0 0 6px!important}
.fb.ok .fb-r{color:var(--gold)}
.fb-a{margin:0 0 6px!important}
.fb-a .en{font-size:24px;color:var(--gold)}
.fb-w{margin:8px 0!important}
.fb-w .en{font-size:22px;font-weight:600;color:var(--gold)}
.pos{font-size:12px;opacity:.75;margin:0 6px}
.fb hr{border:0;border-top:1px solid rgba(255,255,255,.2);margin:10px 0}
.letters{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.lt{display:inline-flex;align-items:flex-end;justify-content:center;width:30px;height:38px;border-bottom:2px solid var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:600}
.attempt{text-align:center;font-size:20px;letter-spacing:.08em;margin:6px 0 0;font-family:'Zen Maru Gothic',sans-serif}
.m{color:var(--ok);text-decoration:underline;text-underline-offset:4px}
.spell-msg{text-align:center;font-size:13px;color:var(--sub);margin:4px 0}
.spell{display:flex;gap:8px;margin:12px 0 0}
.spell input{flex:1;min-width:0;min-height:52px;font-size:22px;padding:6px 12px;border:1px solid var(--plum);border-radius:4px;font-family:'Zen Maru Gothic',sans-serif;background:#fff;color:var(--ink)}
.spell .btn{margin:0;flex:none;white-space:nowrap}
.hints{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 0}
.result h2{font-size:22px}

/* ---------- 入試の形 ---------- */
.group{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;border:1px solid var(--ink);border-radius:2px;padding:8px 12px;margin:12px 0 0;font-size:20px;font-weight:600}
.group .g-k{font-size:12px;font-weight:700;color:var(--sub);margin-right:4px;font-family:'Zen Maru Gothic',sans-serif}
.doc{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:12px 14px;margin:8px 0}
.doc p{margin:0 0 4px}
.doc .en{font-size:18px;line-height:1.55}
.doc-t{font-size:12px;font-weight:700;color:var(--sub);margin:0 0 6px!important}
.dt{border-collapse:collapse;width:100%;font-size:14px}
.dt th,.dt td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.dt th{background:#f6efe6;font-weight:700}
.dt .sub{display:block;font-size:11px;color:var(--sub)}
.memo{border:1px dashed var(--ink);border-radius:2px;padding:10px 14px;margin:10px 0 0;background:#fffdf8}
.memo .en{font-size:20px;margin:0;font-weight:600}
.scene{font-size:13px;color:var(--sub);margin:6px 0}
.audio{margin:8px 0 4px}
.audio .btn{margin:0}

/* ---------- 単語帳・記録・設定 ---------- */
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 10px;overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;min-height:44px;color:var(--sub);cursor:pointer;white-space:nowrap}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--plum);font-weight:700}
.search{width:100%;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:var(--r);font:inherit;background:#fff;margin:0 0 6px}
.wrow{border-bottom:1px solid var(--line)}
.wbtn{display:grid;grid-template-columns:8.5em 1fr auto;gap:10px;align-items:center;width:100%;min-height:48px;padding:6px 2px;background:none;border:0;text-align:left;cursor:pointer}
.wbtn .en{font-size:19px;font-weight:600}
.wbtn .ja{font-size:14px;color:var(--sub)}
.wdetail{padding:4px 2px 14px}
.wdetail .ex{margin:0;font-size:18px;color:var(--toru);font-weight:600}
.wdetail .tk{margin:8px 0 0;font-size:14px;color:var(--voice)}
.wdetail .meta{font-size:12px;color:var(--sub);margin:8px 0 0}
table.kv{border-collapse:collapse;width:100%;font-size:14px}
table.kv td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.kv td:last-child{text-align:right;font-weight:700}
table.kv.txt td:last-child{text-align:left;font-weight:400}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:90px;border-bottom:1px solid var(--ink);margin-top:8px}
.bars i{display:block;background:var(--plum);min-height:1px}
.bars i.zero{background:var(--line)}
.bar-lbl{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:10px;color:var(--sub);text-align:center}
.set label{display:flex;align-items:center;gap:8px;min-height:44px}
.set input[type=date],.set select{min-height:44px;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.set textarea{width:100%;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:var(--r);padding:8px;margin-top:8px}
details pre{white-space:pre-wrap;font:11px/1.5 ui-monospace,Menlo,monospace;max-height:240px;overflow:auto;background:#f4f1ec;padding:8px;border-radius:4px}
.ver{font-size:12px;color:var(--plum);text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90vw;background:var(--win);border:1px solid var(--win-line);color:#fff;padding:10px 16px;border-radius:4px;font-size:14px;z-index:30}

/* ---------- 場面カード（トレカ・v0.9）。見せ方は見本3案から本人が「b チェキ（アルバム風）」を選んだ（2026-11-05。a フィルム・c 栞は消した） ---------- */
.tc{position:relative;font-size:10px;width:16em;aspect-ratio:63/88;perspective:900px;cursor:pointer;flex:none;color:var(--ink)}
.tc.big{font-size:clamp(14px,4.6vw,20px)}
.tc-in{position:absolute;inset:0;transition:transform .7s;transform-style:preserve-3d}
.tc.flip .tc-in{transform:rotateY(180deg)}
.tc-front,.tc-back,.tc-sleeve{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:.5em;overflow:hidden}
.tc-art{position:relative;overflow:hidden}
.tc-art i{position:absolute;display:block}
.tc-art.bg-eve{background:linear-gradient(180deg,#f6d1a8,#eaa892 55%,#bb849b)}
.tc-art.bg-day{background:linear-gradient(180deg,#fff4e4,#f6dcc6 60%,#ecc3b6)}
.tc-art.bg-dusk{background:linear-gradient(180deg,#f1c4c7,#bd97b9 55%,#857aa9)}
.tc-art.bg-rain{background:linear-gradient(180deg,#e4eaf1,#b9c6d4 60%,#94a5ba)}
.tc-art.bg-night{background:linear-gradient(180deg,#3a3f6e,#232850 60%,#151935)}
.tc-sash{top:12%;right:-6%;width:52%;height:64%;border:.35em solid rgba(255,248,236,.55);border-radius:.2em .2em 0 0}
.tc-sash::before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:.3em solid rgba(255,248,236,.55)}
.tc-sash::after{content:'';position:absolute;top:45%;left:0;right:0;border-top:.3em solid rgba(255,248,236,.55)}
.bg-night .tc-sash,.bg-night .tc-sash::before,.bg-night .tc-sash::after{border-color:rgba(255,236,200,.28)}
.tc-beam{top:-30%;left:18%;width:28%;height:170%;background:rgba(255,250,235,.22);transform:rotate(28deg)}
.tc-rain{inset:0;background:repeating-linear-gradient(100deg,transparent 0 .8em,rgba(255,255,255,.5) .8em .88em)}
.tc-stars{inset:0;background:radial-gradient(circle at 18% 22%,#fff 0 .07em,transparent .12em),radial-gradient(circle at 62% 12%,#fff 0 .06em,transparent .11em),radial-gradient(circle at 80% 40%,#ffe9c4 0 .07em,transparent .12em),radial-gradient(circle at 35% 48%,#fff 0 .05em,transparent .1em),radial-gradient(circle at 12% 70%,#fff 0 .05em,transparent .1em)}
.tc .tc-motif{position:absolute;left:.12em;bottom:0;font-size:6em;width:auto;height:auto;line-height:1;color:rgba(255,255,255,.62)}
.tc-kind{position:absolute;top:.7em;right:.7em;z-index:2;font-size:.75em;letter-spacing:.15em;padding:.1em .45em;border-radius:.2em;background:rgba(38,30,58,.7);color:#fff}
.tc-holo{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.5) 42%,rgba(190,225,255,.38) 50%,rgba(255,200,235,.38) 58%,transparent 75%);background-size:260% 100%;mix-blend-mode:screen;animation:holo 3.6s ease-in-out infinite}
@keyframes holo{0%{background-position:120% 0}100%{background-position:-60% 0}}
.k-effort .tc-front{outline:.28em solid #d8b56d;outline-offset:-.28em}
.k-effort .tc-kind{background:#b8913e}
.k-chapter .tc-kind{background:#c4577a}
/* 尊い絵（v0.9）：逆光・玉ぼけ・光の粒・うすい桃色のにじみ。アルバムでは止め、大きく見るときだけ粒がまたたく */
.tc-glow{width:80%;aspect-ratio:1;margin:-40% 0 0 -40%;border-radius:50%;background:radial-gradient(circle,rgba(255,252,240,.95) 0,rgba(255,238,215,.6) 22%,rgba(255,222,205,0) 68%)}
.bg-dusk .tc-glow{background:radial-gradient(circle,rgba(255,240,230,.9) 0,rgba(255,206,220,.5) 25%,transparent 68%)}
.bg-rain .tc-glow{background:radial-gradient(circle,rgba(255,255,255,.85) 0,rgba(232,240,255,.35) 28%,transparent 68%)}
.bg-night .tc-glow{background:radial-gradient(circle,rgba(255,236,190,.6) 0,rgba(255,214,170,.18) 28%,transparent 66%)}
.tc-bk{aspect-ratio:1;border-radius:50%;margin:-6% 0 0 -6%;background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,244,236,.55) 42%,rgba(255,255,255,0) 70%)}
.bg-eve .tc-bk,.bg-dusk .tc-bk{background:radial-gradient(circle,rgba(255,240,226,.95) 0,rgba(255,196,212,.5) 45%,transparent 70%)}
.bg-night .tc-bk{background:radial-gradient(circle,rgba(255,232,190,.8) 0,rgba(255,200,160,.3) 45%,transparent 70%)}
.bg-rain .tc-bk{background:radial-gradient(circle,rgba(255,255,255,.9) 0,rgba(220,232,250,.45) 45%,transparent 70%)}
.tc-art .tc-sp{font-style:normal;line-height:1;color:#fff;text-shadow:0 0 .35em rgba(255,236,214,.95),0 0 .8em rgba(255,200,220,.7);opacity:.85}
.tc.big .tc-sp{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.tc-b .tc-fx{display:block;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(255,190,214,.42) 100%),linear-gradient(180deg,rgba(255,220,235,.22),transparent 45%,rgba(255,214,228,.3))}
.tc .tc-motif{left:auto;right:.12em;bottom:.05em;font-size:4.2em;color:rgba(255,255,255,.82);text-shadow:0 0 .25em rgba(255,214,228,.9)}
.bg-day .tc-motif,.bg-rain .tc-motif{color:rgba(255,255,255,.9);text-shadow:0 0 .3em rgba(160,110,140,.45)}
.tc-scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.has-scene .tc-bk{opacity:.18!important}
.tc-art.has-img{background:#fffdf8}
.tc-art .tc-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tc-art .tc-img-in{animation:tcImgIn .35s ease-out}   /* GAS 版：あとから届いた絵は、ふわっと出す */
@keyframes tcImgIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.tc-art .tc-img-in{animation:none}}
.has-img .tc-sp{font-size:.7em!important;opacity:.7}
/* うら */
.tc-back{transform:rotateY(180deg);background:#fbf6ee;border:1px solid #e3d6c3;padding:1.2em 1.1em;display:flex;flex-direction:column;gap:.45em;font-size:1em}
.tc-back p{margin:0}
.tb-k{font-size:.8em;letter-spacing:.25em;color:var(--voice)}
.tb-t{font-size:1.35em;font-weight:700}
.tb-from{font-size:.85em;color:var(--sub);border-bottom:1px solid #e3d6c3;padding-bottom:.5em}
.tb-en{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.15em;font-weight:600;line-height:1.3}
.tb-q{font-size:1.05em;line-height:1.55}
.tb-cap{font-size:.9em;line-height:1.6;color:#6a5c70;margin-top:auto!important}
.tb-date{font-size:.75em;color:var(--sub)}
/* まだ手に入れていない（伏せ札） */
.tc-sleeve{background:#3a2c4c;border:.3em solid #4f3d63;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1em;color:rgba(255,236,214,.85)}
.tc-sleeve b{font-size:2.6em;letter-spacing:.2em}
.tc-sleeve small{font-size:.95em;line-height:1.5;margin-top:.6em}
.tc.locked{cursor:default}
.tc-new{position:absolute;top:-.7em;left:-.4em;z-index:4;background:#c4577a;color:#fff;font-size:1em;padding:.1em .5em;border-radius:.2em;letter-spacing:.1em}
/* b チェキ：白いふちの写真に、手書きの一言 */
.tc-b .tc-front{background:#fffdf8;border:1px solid #e6ddcf;display:flex;flex-direction:column;padding:.7em .7em 0}
.tc-b .tc-art{aspect-ratio:1/1;border-radius:.1em}
.tc-b .tc-date,.tc-b .tc-en{display:none}
.tc-b .tc-txt{flex:1;display:flex;align-items:center;justify-content:center;padding:.3em .2em 1.75em}
.tc-b .tc-q{font-family:'Klee One',cursive;font-weight:600;color:#3b3142;font-size:1.1em;line-height:1.45;margin:0;text-align:center;text-wrap:balance}
.tc-b .tc-t{position:absolute;right:.9em;bottom:.45em;margin:0;font-family:'Klee One',cursive;font-size:.8em;color:#9a8a96}
.cards-grid .tc-b:nth-child(odd){transform:rotate(-1.4deg)}
.cards-grid .tc-b:nth-child(even){transform:rotate(1.1deg)}
/* アルバム・手に入れたときの画面 */
.cards-sec h3{display:flex;justify-content:space-between;align-items:baseline}
.cards-grid{display:flex;flex-wrap:wrap;gap:1.4em 1em;padding:.4em 0 .6em}
.tcm{position:fixed;inset:0;z-index:40;background:rgba(24,18,34,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;overflow:auto}
.tcm-k{color:var(--gold);letter-spacing:.3em;font-size:14px;margin:0}
.tcm-n,.tcm-hint{color:rgba(255,248,240,.6);font-size:12px;margin:0}
.tcm-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tcm-btns .btn{min-width:9em}
.tcm .btn.ghost{color:#fff;border-color:rgba(255,248,240,.55);background:transparent}
.rv .rv-in{animation:rvIn .9s .25s both}
@keyframes rvIn{0%{transform:perspective(900px) rotateY(-110deg) scale(.7);opacity:0}55%{opacity:1}100%{transform:none}}
.rv .tc-front::after{content:'';position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);background-size:300% 100%;animation:shine 1.2s 1s ease-out both}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-50% 0}}
.home-cards{background:none;border:0;cursor:pointer;color:inherit;font:inherit;padding:0;width:100%}

/* ---------- やり込み B：箔押しカード（v0.11）。案1「紺地に金の箔押し」（2026-11-18 本人が選んだ。見本 design/見本_箔押し.html）。
   本の表紙の箔押しのように、セリフの欄が紺の紙になり、文字と罫が金で光る。左上に金の菱形。一度光ったら取り上げない ---------- */
.tc.foil .tc-front{background:#fbf6ec;border-color:#c9a24f}
.tc.foil .tc-front::before{content:'';position:absolute;inset:.3em;border:1px solid #d9b45e;border-radius:.35em;pointer-events:none;z-index:3}
/* 絵の内側の細い金の罫は .tc-art の ::before に置く（GAS 版で絵があとから届いて中身が差しかわっても残る） */
.tc.foil .tc-art::before{content:'';position:absolute;inset:.35em;border:1px solid rgba(255,241,194,.85);z-index:2;pointer-events:none}
.tc.foil .tc-txt{margin:0 -.7em;padding:.55em .9em 2.05em;background:linear-gradient(180deg,#2a2347,#1d1838);position:relative}
.tc.foil .tc-txt::before,.tc.foil .tc-txt::after{content:'';position:absolute;left:1em;right:1em;height:1px;background:linear-gradient(90deg,transparent,#e2c06b 20%,#fff1c2 50%,#e2c06b 80%,transparent)}
.tc.foil .tc-txt::before{top:.35em}.tc.foil .tc-txt::after{bottom:.45em}
.tc.foil .tc-q,.tc.foil .tc-t{background:linear-gradient(105deg,#b8862f 0%,#f3d98e 22%,#fffbe6 34%,#d9ae52 48%,#b8862f 60%,#f6e3a1 80%,#b8862f 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:foilGold 5s linear infinite}
.tc.foil .tc-q{font-size:1.15em}
/* 3行になる長いセリフは一段小さく（下の題名にかぶらないように。白いカードも同じ） */
.tc-b .tc-q.long,.tc.foil .tc-q.long{font-size:.96em;line-height:1.4}
.tc.foil .tc-t{z-index:4;bottom:.6em;right:1.1em;font-size:.85em}
@keyframes foilGold{from{background-position:130% 0}to{background-position:-130% 0}}
/* 金の菱形（右上は種類の札なので左上に置く） */
.tc-stamp{position:absolute;left:1.15em;top:1.15em;z-index:4;width:2.1em;height:2.1em;transform:rotate(45deg);background:linear-gradient(135deg,#fff1c2,#d9ae52 45%,#9c6e22);box-shadow:0 0 0 .15em rgba(255,255,255,.8)}
.tc.foil .tc-back{background:#fbf6ec;border-color:#c9a24f;box-shadow:inset 0 0 0 .3em #fbf6ec,inset 0 0 0 calc(.3em + 1px) #d9b45e}
/* うらに一言の行が増えるので、字と間を少し詰める（スマホ幅 375 で第3・4章の長い英文が下にあふれていた）。それでも入らないときは、うらの中で縦に送れる */
.tc-back{padding:.9em .95em;gap:.25em;font-size:.86em;overflow-y:auto}
.tb-foil{font-family:'Klee One',cursive;font-weight:600;font-size:.95em;line-height:1.55;color:#8a6a2e;border-top:1px solid rgba(184,145,62,.45);padding-top:.45em}
.tb-foil-lock{font-size:.75em;color:var(--fade)}
.tc.foil-new .tc-in{animation:foilPop 1.6s ease-out}
@keyframes foilPop{30%{transform:scale(1.06)}}
.foil-sum{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
.foil-sum b{font-size:18px;color:#8a6a2e;margin-right:2px}
.foil-sum span{display:block}
.tc-cell{display:flex;flex-direction:column;gap:.7em;width:16em;font-size:10px}
.cards-grid .tc-cell:nth-child(odd) .tc-b{transform:rotate(-1.4deg)}
.cards-grid .tc-cell:nth-child(even) .tc-b{transform:rotate(1.1deg)}
.fp p{margin:0}
.fp-t{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 4px;font-size:11px;line-height:1.5;color:var(--sub)}
.fp-ok{color:#8a6a2e;font-weight:700}
.fp-bar{display:flex;gap:2px;margin-top:2px!important}
.fp-bar i{flex:1;height:6px;border-radius:2px;background:rgba(43,36,51,.15)}
.fp-bar i.on{background:#d8b56d}

/* =========================================================
   [S3] Store：記録はこの端末の localStorage だけ（個人情報は持たない）
   ========================================================= */
const KEY = 'sontan.v1';
const DEFAULT = () => ({ v: 1, words: {}, eps: {}, chs: {}, log: {}, fs: {}, ky: {}, cards: {}, cardNew: [], cardSeen: {}, bonusDone: {}, bestStreak: 0, noteDone: {}, foil: {}, foilNew: [], set: { exam: '2027-03-03', tts: true, rate: 0.9, tk: true, voice: false } });
let S = DEFAULT();
let canSave = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    S = Object.assign(DEFAULT(), d);
    S.set = Object.assign(DEFAULT().set, d.set || {});
    tidy();
  } catch (e) { console.warn('記録を読めなかった', e); }
}
/** 前の版の記録に無い項目・形のちがう項目を、空にそろえる（v0.11 で noteDone・foil・foilNew を足した） */
function tidy() {
  ['noteDone', 'foil'].forEach(k => { if (!S[k] || typeof S[k] !== 'object' || Array.isArray(S[k])) S[k] = {}; });
  if (!Array.isArray(S.foilNew)) S.foilNew = [];
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (canSave) { canSave = false; toast('この端末では記録が残せない設定になっている'); console.warn('保存できない', e); } }
}
/** 単語ごとの記録（s=段階 0未習/1うろ覚え/2〜7, due=次の復習, ok/ng=はじめの答えの正誤） */
const ws = id => S.words[id] || (S.words[id] = { s: 0, due: 0, ok: 0, ng: 0, last: 0 });
const epSt = ep => S.eps[ep.id] || { pos: 0, learned: false, done: false };
const epW = ep => S.eps[ep.id] || (S.eps[ep.id] = { pos: 0, learned: false, done: false });
const today = () => S.log[ymd(now())] || (S.log[ymd(now())] = { n: 0, r: 0, ok: 0, ng: 0 });
const chCleared = c => !!(S.chs[c.id] && S.chs[c.id].cleared);
function chUnlocked(c) { if (DEV) return !!c.eps; const i = CHAPTERS.indexOf(c); if (i === 0) return true; const p = CHAPTERS[i - 1]; return !!p.eps && chCleared(p); }
function epUnlocked(ep) { if (DEV) return true; const c = ep.ch; if (!chUnlocked(c)) return false; const i = c.eps.indexOf(ep); return i === 0 || epSt(c.eps[i - 1]).done; }
const chTestReady = c => !!c.eps && c.eps.every(ep => epSt(ep).done);
const chName = c => `第${c.no}章`;
const epNo = ep => ep.ch.eps.indexOf(ep) + 1;

/* =========================================================
   [S4] 記憶の段階（間隔反復）
   ---------------------------------------------------------
   段階 2 → 1日後、3 → 3日後、4 → 7日後、5 → 14日後、6 → 30日後、7（殿堂入り）→ 60日後
   はじめの答えが正解 → 段階が1つ上がる（復習の日が来ている語だけ）
   まちがい → 段階1（うろ覚え）に戻り、物語の訳がまた ■■ になる。同じ回で直せたら段階2
   訳の見え方：段階2以上で日が来ていない＝読める／日が来た＝霞む／段階1以下＝読めない
   ========================================================= */
const IVL = { 2: 1, 3: 3, 4: 7, 5: 14, 6: 30, 7: 60 };
const isDue = st => st.s >= 1 && st.due <= now();
const dueAt = s => (s <= 1 ? now() : dayStart(now()) + IVL[s] * DAY);
function setStage(id, s) { const st = ws(id); st.s = s; st.due = dueAt(s); st.last = now(); }
function tally(id, ok) { const st = ws(id); const t = today(); if (ok) { st.ok++; t.ok++; } else { st.ng++; t.ng++; } }
const SRS = {
  learned(id) { setStage(id, 2); },
  ok(id) { tally(id, true); const st = ws(id); if (st.s <= 1) setStage(id, 2); else if (isDue(st)) setStage(id, Math.min(7, st.s + 1)); },
  ng(id) { tally(id, false); setStage(id, 1); },
  relearn(id) { if (ws(id).s <= 1) setStage(id, 2); },
  vis(id) { if (DEV) return 'ok'; const st = S.words[id]; if (!st || st.s < 2) return 'unk'; return isDue(st) ? 'fade' : 'ok'; },
  due() { return WORDS.filter(w => S.words[w.id] && isDue(S.words[w.id])).sort((a, b) => S.words[a.id].due - S.words[b.id].due); },
};
const lockedNow = () => SRS.due().length >= LOCK_DUE;
const learnedCount = () => WORDS.filter(w => (S.words[w.id] || {}).s >= 2).length;
const clearCount = () => WORDS.filter(w => SRS.vis(w.id) === 'ok').length;
/** ふたりの距離（m）：読める語が増えるほど縮み、霞むと開く */
const distance = () => 10 * (1 - clearCount() / WORDS.length);
function stageTag(id) {
  const st = S.words[id]; if (!st || st.s < 1) return '';
  if (st.s >= 2 && isDue(st)) return '<span class="tag fade">霞んでいる</span>';
  if (st.s === 1) return '<span class="tag">うろ覚え</span>';
  if (st.s <= 3) return '<span class="tag toru">覚えたて</span>';
  if (st.s <= 6) return '<span class="tag ok">定着</span>';
  return '<span class="tag ok">殿堂入り</span>';
}
function streak() {
  const active = k => { const l = S.log[k]; return !!l && (l.n + l.r) > 0; };
  let d = dayStart(now()); if (!active(ymd(d))) d -= DAY;
  let n = 0; while (active(ymd(d))) { n++; d -= DAY; }
  return n;
}
function daysLeft() {
  const t = new Date(S.set.exam + 'T00:00:00').getTime();
  return isNaN(t) ? -1 : Math.round((t - dayStart(now())) / DAY);
}

/* =========================================================
   [S5] 読み上げ
   ---------------------------------------------------------
   1. 音声ファイルを先に使う（audio/index.js の対応表。tools/make_audio.mjs が Mac の声で作る）。どの端末でも同じ声が鳴る
   2. ファイルが無い文だけ、ブラウザの読み上げ（Web Speech）に回す。遊び用の声（Albert・Bubbles など）は選ばない。
      3秒たっても始まらなければ止めて知らせる（Claude のアプリの中のブラウザでは始まらなかった・2026-10-27）
   声：単語＝アメリカ英語／透の英語・例文・日記＝イギリス英語（男声）／陽太の英語＝アメリカ英語（男声）
   ========================================================= */
const ODD_VOICE = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Wobble|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Zarvox|Fred|Junior|Kathy|Ralph|Grandma|Grandpa)\b/;
const GOOD_VOICE = /^(Samantha|Alex|Daniel|Karen|Moira|Tessa|Serena|Allison|Ava|Tom|Arthur|Martha|Google (US|UK) English|Microsoft (Aria|Jenny|Guy|Libby|Ryan|Sonia))/;
const TTS = {
  ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
  voices: [],
  init() { if (!this.ok) return; const load = () => { this.voices = speechSynthesis.getVoices() || []; }; load(); speechSynthesis.onvoiceschanged = load; },
  files() { return window.AUDIO_INDEX || null; },
  available() { return !!this.files() || this.ok; },
  can() { return !!S.set.tts && this.available(); },
  tag(who) { return who === 'toru' || who === 'note' ? 'uk' : who === 'yota' ? 'usm' : who === 'leo' ? 'ukl' : 'us'; },
  /** 端末の声を選ぶ：同じ言語のよい声 → 英語のよい声 → 同じ言語の声（遊び用の声は除く） */
  voice(lang) {
    const en = this.voices.filter(v => /^en[-_]/i.test(v.lang) && !ODD_VOICE.test(v.name));
    const same = en.filter(v => v.lang.replace('_', '-') === lang);
    return same.find(v => GOOD_VOICE.test(v.name)) || en.find(v => GOOD_VOICE.test(v.name)) || same[0] || en[0] || null;
  },
  say(text, who) {
    if (!S.set.tts || !text) return;
    const f = this.files() && this.files()[`${this.tag(who)}|${text}`];
    if (f) return this.play('audio/' + f);
    this.speak(text, who);
  },
  /** 音声ファイルを鳴らす（1つの audio を使い回す。iPhone でも最初に押したときから鳴るように） */
  play(src, report) {
    this.stop();
    const a = this.el || (this.el = new Audio());
    a.src = src;
    a.playbackRate = (Number(S.set.rate) || 0.9) / 0.9;
    a.onplaying = () => report && report('鳴った');
    a.onended = () => report && report(`鳴った（${a.duration.toFixed(1)}秒）`);
    a.onerror = () => { console.warn('音声ファイルを読めない', src); report ? report('ファイルを読めなかった') : this.speakFallback(src); };
    const p = a.play();
    if (p && p.catch) p.catch(e => { console.warn('音声ファイルを鳴らせない', src, e && e.name); if (report) report(`鳴らせなかった（${e && e.name}）`); else this.warnOnce('音声を鳴らせなかった。端末の音量と消音のスイッチを確かめてね'); });
  },
  speakFallback() { this.warnOnce('音声ファイルが見つからない。端末の読み上げに切り替える'); },
  /** ブラウザの読み上げ。始まらなければ3秒で止めて知らせる */
  speak(text, who, report) {
    if (!this.ok) { if (report) report('この端末には読み上げの機能がない'); else this.warnOnce('この端末では読み上げが使えない'); return; }
    try {
      const busy = speechSynthesis.speaking || speechSynthesis.pending;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = this.voice(who === 'toru' || who === 'note' ? 'en-GB' : 'en-US');
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      u.rate = Number(S.set.rate) || 0.9;
      let started = false;
      u.onstart = () => { started = true; if (report) report(`始まった（声：${v ? v.name : '端末の標準'}）`); else if (!S.audioTest || /^自動/.test(S.audioTest)) { S.audioTest = `自動：読み上げできた（声：${v ? v.name : '端末の標準'}・声の数 ${this.voices.length}）`; save(); } };
      u.onend = () => { if (report && started) report(`読み終わった（声：${v ? v.name : '端末の標準'}）`); };
      u.onerror = e => { if (e.error === 'canceled' || e.error === 'interrupted') return; console.warn('読み上げのエラー', e.error); if (report) report(`エラー（${e.error}）`); };   // 自分で止めたときの合図は無視する
      this.u = u;               // Chrome で途中で消えないように持っておく
      const go = () => { try { speechSynthesis.resume(); speechSynthesis.speak(u); } catch (e) { console.warn('読み上げできない', e); } };
      if (busy) setTimeout(go, 80); else go();   // 止めた直後に話させると、Chrome では落ちることがある
      clearTimeout(this.wd);
      this.wd = setTimeout(() => {
        if (started || this.u !== u) return;
        speechSynthesis.cancel();
        console.warn('読み上げが3秒たっても始まらなかった', text);
        if (!report) { S.audioTest = `自動：読み上げが3秒たっても始まらない（声の数 ${this.voices.length}）`; save(); }
        if (report) report('3秒たっても始まらない（この画面では端末の読み上げが動いていない）');
        else this.warnOnce('この画面では、端末の読み上げが動いていない（設定の「音声のテスト」で確かめられる）');
      }, 3000);
    } catch (e) { console.warn('読み上げできない', e); }
  },
  warnOnce(msg) { if (this.warned) return; this.warned = true; toast(msg); },
  stop() {
    if (this.el) try { this.el.pause(); } catch (e) { /* なにもしない */ }
    if (this.ok) try { speechSynthesis.cancel(); } catch (e) { /* なにもしない */ }
  },
};
const spk = (text, who = '') => TTS.available() ? `<button class="spk" data-act="say" data-arg="${esc(text)}" data-who="${who}" aria-label="読み上げ" title="読み上げ"><span class="material-symbols-outlined" aria-hidden="true">volume_up</span></button>` : '';

/** 訳の枠 {id|訳} を、いまの記憶で描く（読める＝金・霞む・■■） */
function jaSlots(ja, fresh) {
  let unk = 0, fade = 0;
  const html = esc(ja).replace(/\{([^}|]+)\|([^}]+)\}/g, (m, id, txt) => {
    const v = SRS.vis(id);
    if (v === 'unk') { unk++; return `<span class="slot unk" data-act="slot" data-arg="unk" aria-label="まだ覚えていない単語">${'■'.repeat(Math.min(4, Math.max(2, txt.length)))}</span>`; }
    if (v === 'fade') { fade++; return `<span class="slot fade" data-act="slot" data-arg="fade">${txt}</span>`; }

}
const sayLine = L => (/^『/.test(L.t) ? esc(L.t) : `「${esc(L.t)}」`);

const kyKey = L => (L.en || L.t).slice(0, 40);

const kyGot = (key, L) => (S.ky[key] || []).includes(kyKey(L));

const kyLines = lines => lines.filter(L => L.ky);

/** いまの1行を会話窓に出す。ky＝キュンを見せる（訳が読めたキュンのセリフ） */
function winHTML(L, fresh, tail, ky) {

  if (L.k === 'v') return `<div class="${cls}"><span class="name voice">心の声</span><p class="v">${esc(L.t)}</p>${tail}</div>`;

VIEWS.reader = ({ ep, bonus, fresh }) => {

  const st = ep ? epW(ep) : null;
  const done0 = !!(st && st.done);
  const newIds = new Set(fresh || []);
  const gateAt = lines.findIndex(L => L.k === 'gate');
  // pos＝出した行の数（いま会話窓にあるのは lines[pos-1]）。読み終えた話は頭から読み返す
  let pos = bonus || (done0 && !fresh) ? 1 : Math.max(1, st.pos);
  // 関門から戻ったら、関門の前の英語のセリフを全部「回想」でもう一度出す。今度は訳が読める（キュンもここで受け取れる）
  let recall = null, rq = [];
  if (fresh && gateAt >= 0) {
    rq = lines.slice(0, gateAt).map((L, k) => (L.k === 'e' ? k : -1)).filter(k => k >= 0);
    recall = rq.length ? rq.shift() : null;
    pos = Math.max(pos, gateAt);
  }
  let showLog = false, sparkled = false, fxAt = -1;
  const curLine = () => (recall !== null ? lines[recall] : lines[pos - 1]);
  const kyNow = () => { const L = curLine(); return !!(L && L.ky && kyReadable(L)); };
  const learned = () => DEV || !st || st.learned;
  function keep() { if (!st) return; st.pos = Math.max(st.pos, pos); if (pos >= lines.length) st.done = true; save(); }
  keep();
  const atGate = () => recall === null && lines[pos] && lines[pos].k === 'gate' && !learned();
  const atEnd = () => recall === null && pos >= lines.length;
  function voice() { const L = curLine(); if (S.set.voice && L && L.k === 'e') TTS.say(plain(L.en), L.w); }
  function adv() {
    if (showLog) return;
    if (recall !== null && rq.length) { recall = rq.shift(); sparkled = false; render(); voice(); return; }
    if (recall !== null) { recall = null; newIds.clear(); pos = Math.min(lines.length, gateAt + 2); keep(); render(); voice(); return; }
    if (atGate() || atEnd()) return;

      ${due >= LOCK_DUE ? `<p class="note">……の前に。復習がたまっている（${due}語）。</p><button class="btn wide" data-act="review">復習する</button>` : `<button class="btn wide" data-act="learn">${list.length}語を覚える</button>`}
    </section>`;

  /** 話のはじめの札：第◯話・題・いつ・どこ・前回まで（ひとつ前の話の sum。第1話には無い） */
  function openingHTML() {

    const name = bonus ? bonus.title.replace(/^おまけ：/, '') : ep.title;
    const at = (bonus || ep).at;
    return `<div class="opening"><p class="op-no">${no}</p><p class="op-title">${esc(name)}</p>${at ? `<p class="op-at">${esc(at)}</p>` : ''}${prev && prev.sum ? `<div class="op-prev"><p class="op-lbl">前回まで</p><p>${esc(prev.sum)}</p></div>` : ''}</div>`;
  }

    const c = ep.ch, i = c.eps.indexOf(ep), nx = c.eps[i + 1];

    if (nx) btn = `<button class="btn wide" data-act="openEp" data-arg="${nx.id}">次の話へ</button>`;

    else { const nc = CHAPTERS[CHAPTERS.indexOf(c) + 1]; if (nc && nc.eps) btn = `<button class="btn wide" data-act="openEp" data-arg="${nc.eps[0].id}">${chName(nc)}へ</button>`; }
    return `<section class="panel end"><p class="lbl">第${i + 1}話 おわり</p>${kyRow()}${btn}<button class="btn ghost wide" data-act="log">LOG で読み返す</button><button class="btn ghost wide" data-act="home">ホームへ</button></section>`;
  }

  }
  return {
    focus: true, tab: 'story', scene: bonus ? 'day' : ep.bg,
    html() {
      const L = curLine();

        voice: '霞んでいた言葉が、戻ってきた。',

/** 入試の形の問題を、章の単語から組み立てる。並びは本番と同じ（聞く → 語と文 → 読む） */
const nyItems = (c, t) => (NYUSHI[c.id] || []).filter(x => x.t === t).map(x => ({ id: x.w, fmt: 'ny', ny: x }));
function buildTest(c) {
  const tts = TTS.can();
  const take = (t, n) => shuffle(nyItems(c, t)).slice(0, n);
  const used = new Set((NYUSHI[c.id] || []).map(x => x.w));
  const pool = shuffle(chWords(c));
  const words = n => {
    const out = pool.filter(w => !used.has(w.id)).slice(0, n);
    while (out.length < n) out.push(pick(pool));
    out.forEach(w => used.add(w.id));
    return out;
  };
  const sec = (label, arr) => arr.map(x => Object.assign(x, { sec: label }));
  return [
    ...sec('大問1 聞く', [...words(2).map(w => ({ id: w.id, fmt: tts ? 'listen' : 'en2ja' })), ...take('resp', 2), ...take('lmemo', 2), ...words(1).map(w => ({ id: w.id, fmt: tts ? 'dictate' : 'write' }))]),
    ...sec('大問2 語と文', [...take('gform', 2), ...words(2).map(w => ({ id: w.id, fmt: 'pick' })), ...take('shiryo', 2)]),
    ...sec('大問3 読む', take('read', 2)),
    ...sec('単語', [...words(2).map(w => ({ id: w.id, fmt: 'en2ja' })), ...words(2).map(w => ({ id: w.id, fmt: 'ja2en' })), ...words(1).map(w => ({ id: w.id, fmt: 'write' }))]),
  ];
}
function secTable(Q) {
  return `<table class="kv">${Object.entries(Q.secs).map(([k, s]) => `<tr><td>${esc(k)}</td><td>${s.ok} / ${s.n}</td></tr>`).join('')}</table>`;
}
function startTest(cid) {
  const c = CHAPTERS.find(x => x.id === cid);
  if (!c || !chTestReady(c)) return toast('全部の話を読むと受けられる');
  const items = buildTest(c);
  go('quiz', {
    kind: 'test', title: `${chName(c)} 章末テスト`, requeue: false, items,
    onDone(Q) {
      const n = items.length, need = Math.ceil(n * PASS_RATE), pass = Q.score >= need;
      const rec = S.chs[c.id] || (S.chs[c.id] = { cleared: false, best: 0, tries: 0 });
      rec.tries++; rec.best = Math.max(rec.best, Q.score); if (pass) rec.cleared = true; if (Q.score >= n) rec.full = true;   // full＝満点をとった（おまけのカードの箔押し）
      save();
      const missed = [...Q.missed].map(id => WMAP[id].en);
      const nc = CHAPTERS[CHAPTERS.indexOf(c) + 1];
      const btns = [];
      if (pass && c.bonus) btns.push({ label: `${c.bonus.title}を読む`, fn: () => go('reader', { bonus: c.bonus }) });
      if (pass && nc && nc.eps) btns.push({ label: `${chName(nc)}へ`, fn: () => openEp(nc.eps[0].id), ghost: btns.length > 0 });
      if (!pass) btns.push({ label: '復習する', fn: startReview });
      btns.push({ label: 'ホームへ', fn: () => go('home'), ghost: true });
      go('result', {
        title: pass ? `合格。${Q.score} / ${n}` : `${Q.score} / ${n}。合格は${need}問`,
        voice: pass ? '合格……！ 次の章が、読める。' : '解釈違い……じゃなくて、あと少し。',
        body: `${secTable(Q)}
          ${missed.length ? `<p class="note">まちがえた単語：${missed.join('、')}（復習に回った）</p>` : '<p class="note">全問正解。殿堂入りへの道。</p>'}
          ${!pass ? '<p class="note">まちがえた単語を復習してから、もう一度受けよう。</p>' : ''}`,
        btns,
      });
    },
  });
}
/** 入試の形で練習：その章の入試の形の問題を全部、本番の順で */
function startDrill(cid) {

const CARD_KIND = { scene: '場面', chapter: '章', bonus: 'おまけ', effort: 'がんばり' };
const cardKind = c => c.kind || (c.ep ? 'scene' : c.ch ? 'chapter' : c.bonus ? 'bonus' : 'effort');

const cardHas = id => DEV || !!S.cards[id];

function cardFrom(c) {

  if (c.bonus) { const ch = CHAPTERS.find(x => x.id === c.bonus); return `${chName(ch)} ${ch.bonus.title}`; }
  if (c.streak) return `${c.streak}日つづけて学んだ`;
  return `${c.words}語覚えた`;

function cardHint(c) {
  if (c.ep) { const ep = EPS.find(e => e.id === c.ep); return `${chName(ep.ch)} 第${epNo(ep)}話を読み終えると`; }
  if (c.ch) return `${chName(CHAPTERS.find(x => x.id === c.ch))}の章末テストに合格すると`;
  if (c.bonus) return `${chName(CHAPTERS.find(x => x.id === c.bonus))}のおまけを読むと`;
  if (c.streak) return `${c.streak}日つづけて学ぶと`;
  return `${c.words}語覚えると`;
}
function cardEarned(c) {
  if (c.ep) { const ep = EPS.find(e => e.id === c.ep); return !!ep && epSt(ep).done; }
  if (c.ch) { const ch = CHAPTERS.find(x => x.id === c.ch); return !!ch && chCleared(ch); }
  if (c.bonus) return !!S.bonusDone[c.bonus];
  if (c.streak) return (S.bestStreak || 0) >= c.streak;
  if (c.words) return learnedCount() >= c.words;
  return false;
}
/** 手に入れられるのにまだ持っていないカードを、今日の日付で記録に足す。足した枚数を返す */
function cardCheck() {
  S.bestStreak = Math.max(S.bestStreak || 0, streak());
  const got = CARDS.filter(c => !S.cards[c.id] && cardEarned(c)).map(c => c.id);
  if (!got.length) return 0;
  got.forEach(id => { S.cards[id] = ymd(now()); });
  S.cardNew = [...new Set([...(S.cardNew || []), ...got])];
  save();
  return got.length;
}
/** 人物の入った場面（見本・v0.9）。顔は描かない：後ろ姿・逆光のシルエット・ふちの光で、表情が見えない写り方にする。
 *  画像生成は使わない（旭川市生成AIガイドライン Ver.1.0 Ⅲ2）。SVG の id はカードごとに変える（同じ場面が何枚あっても混ざらない） */
let sceneSeq = 0;
/** 場面カードの絵。手元・Pages・体験版は img/cards/<id>.jpg のファイルを直接読む。
 *  GAS 版はファイルを配れないので、見るときに Code.gs の getCardImgs から絵の中身（base64）を取りに行く
 *  （最初に読みこむ画面を、絵の枚数によらず軽く保つため）。取りに行くのは画面に入ったカードだけ・同時に3本まで・1本に4枚まで。
 *  取ってきた絵はこの画面を開いている間だけ覚え、同じ絵は2回取りに行かない。来るまで・来なかったら（失敗・10秒）CSS の絵のまま */
const CARD_GAS = (() => { try { return !!(typeof google !== 'undefined' && google.script && google.script.run); } catch (e) { return false; } })();
const cardImgMem = new Map();   // id → data URI（GAS 版で取ってきた絵）
const cardImg = c => !c.img ? '' : CARD_GAS ? (cardImgMem.get(c.id) || '') : `img/cards/${c.id}.jpg`;
const CIMG = { want: [], busy: 0, asked: new Set(), fails: {}, io: null, seen: new Set(), soon: 0, pump: 0, MAX: 3, PER: 4, WAIT: 10000 };
/** まだ絵の来ていないカード（data-cimg）を探し、画面に入ったら取りに行く */
function cardImgScan() {
  CIMG.soon = 0;
  if (CIMG.io) CIMG.seen.forEach(a => { if (!a.isConnected) { CIMG.io.unobserve(a); CIMG.seen.delete(a); } });   // 描き直しで消えたカードは見張りをやめる
  document.querySelectorAll('.tc-art[data-cimg]:not([data-cw])').forEach(a => {
    a.setAttribute('data-cw', '1');
    if (cardImgMem.has(a.dataset.cimg)) cardImgPaint(a.dataset.cimg);
    else if (CIMG.io) { CIMG.io.observe(a); CIMG.seen.add(a); }
    else cardImgWant(a.dataset.cimg);
  });
}
function cardImgWant(id) {
  if (cardImgMem.has(id)) { cardImgPaint(id); return; }
  if (CIMG.asked.has(id) || (CIMG.fails[id] || 0) >= 2) return;   // 2回だめだった絵は、この画面では CSS の絵のまま
  CIMG.asked.add(id); CIMG.want.push(id);
  if (!CIMG.pump) CIMG.pump = setTimeout(() => { CIMG.pump = 0; cardImgPump(); }, 0);   // 同じときに見えたカードを1本にまとめてから送る
}
function cardImgPump() {
  while (CIMG.busy < CIMG.MAX && CIMG.want.length) {
    const ids = CIMG.want.splice(0, CIMG.PER);
    let done = false, timer = 0;
    const finish = res => {
      const first = !done;
      if (first) { done = true; clearTimeout(timer); CIMG.busy--; }
      ids.forEach(id => {
        const b = res && typeof res === 'object' ? res[id] : '';
        if (typeof b === 'string' && b.length > 100 && /^[A-Za-z0-9+/=]+$/.test(b)) {
          if (!cardImgMem.has(id)) { cardImgMem.set(id, 'data:image/jpeg;base64,' + b); cardImgPaint(id); }
        } else if (first) CIMG.fails[id] = (CIMG.fails[id] || 0) + 1;
        if (first) CIMG.asked.delete(id);
      });
      if (first) cardImgPump();   // 10秒を過ぎて届いた絵も、来たら差す（空いた口は先に次へ回す）
    };
    CIMG.busy++;
    timer = setTimeout(() => finish(null), CIMG.WAIT);
    try { google.script.run.withSuccessHandler(finish).withFailureHandler(() => finish(null)).getCardImgs(ids); }
    catch (e) { finish(null); }
  }
}
/** 届いた絵を、いま画面にあるそのカードに差す（CSS の絵を外し、またたく粒だけ残す） */
function cardImgPaint(id) {
  const src = cardImgMem.get(id);
  document.querySelectorAll('.tc-art[data-cimg]').forEach(a => {
    if (a.dataset.cimg !== id) return;
    if (CIMG.io) { CIMG.io.unobserve(a); CIMG.seen.delete(a); }
    const sp = [...a.querySelectorAll('.tc-sp')].map(x => x.outerHTML).join('');
    a.removeAttribute('data-cimg'); a.removeAttribute('data-cw');
    a.className = 'tc-art has-img';
    a.innerHTML = `<img class="tc-img tc-img-in" src="${src}" alt="" decoding="async" onerror="this.remove()">${sp}`;

 *  ぼけと粒の位置はカードの id から決める（いつ見ても同じ絵） */
function cardArt(c) {
  let h = 2166136261; for (const ch of c.id) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => { h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; h = (h ^ (h >>> 13)) >>> 0; return (h % 10000) / 10000; };
  const pct = (a, b) => (a + rnd() * (b - a)).toFixed(1) + '%';
  const sky = c.bg === 'rain' ? '<i class="tc-rain"></i>' : c.bg === 'night' ? '<i class="tc-stars"></i>' : '<i class="tc-beam"></i>';
  const glow = `<i class="tc-glow" style="left:${pct(18, 70)};top:${pct(8, 38)}"></i>`;
  let bokeh = '';
  for (let k = 0; k < 8; k++) bokeh += `<i class="tc-bk" style="left:${pct(-5, 100)};top:${pct(-5, 100)};width:${pct(7, 26)};opacity:${(0.25 + rnd() * 0.5).toFixed(2)}"></i>`;
  let sparks = '';
  for (let k = 0; k < 5; k++) sparks += `<i class="tc-sp" style="left:${pct(4, 92)};top:${pct(4, 85)};font-size:${(0.6 + rnd() * 0.8).toFixed(2)}em;animation-delay:${(rnd() * 3).toFixed(1)}s">✦</i>`;
  // 絵のあるカードは、絵にまたたく粒だけを重ねる（にじみと光は絵の中にある）。読めなかったら絵を外し、白い紙のまま
  const src = cardImg(c);
  if (src) return `<div class="tc-art has-img"><img class="tc-img" src="${src}" alt="" decoding="async" onerror="this.remove()">${sparks}</div>`;
  // GAS 版で絵がまだ来ていないカードは、印（data-cimg）を付けて CSS の絵で描く。絵が届いたら cardImgPaint が差しかえる
  const wait = c.img && CARD_GAS ? ` data-cimg="${c.id}"` : '';
  // 人物の入った場面があるカードは、その絵に光の粒とぼけだけを重ねる（窓・モチーフは場面の中に描いてある）
  if (c.sc && SCENES[c.sc]) return `<div class="tc-art has-scene bg-${c.bg}"${wait}>${SCENES[c.sc]('sc' + (++sceneSeq) + '-')}${bokeh}${sparks}<i class="tc-fx"></i></div>`;
  return `<div class="tc-art bg-${c.bg}"${wait}>${sky}<i class="tc-sash"></i>${glow}${bokeh}${sparks}<span class="material-symbols-outlined tc-motif" aria-hidden="true">${c.mo}</span><i class="tc-fx"></i></div>`;
}

  const t = String(tok).toLowerCase();
  if (WMAP[t]) return WMAP[t];
  for (const w of WORDS) { const b = w.en.toLowerCase(); if (inflect(b, 's') === t || inflect(b, 'ed') === t || inflect(b, 'ing') === t) return w; }
  return null;
}
/** その文を書くのに要る単語帳の語（重ならないように） */
function noteWords(it) {
  if (!it._w) it._w = [...new Set(noteToks(it.en).map(lemmaOf).filter(Boolean))];
  return it._w;
}
const noteNeed = it => noteWords(it).filter(w => stageOf(w.id) < NOTE_STAGE);
const noteChReady = c => DEV || chTestReady(c);
/** done＝書けた／open＝書ける／words＝語が足りない／ch＝章をまだ読み終えていない */
function noteState(it) {
  if (S.noteDone[it.id]) return 'done';
  if (!noteChReady(it.ch)) return 'ch';
  if (DEV) return 'open';
  return noteNeed(it).length ? 'words' : 'open';
}
const noteNeedText = it => { const n = noteNeed(it); return `あと ${n.length} 語（${n.map(w => w.en).join('・')}）を覚えると開く`; };

/** 箔押しの進み：label＝何を数えるか／left＝あと何か／on＝目盛り（0〜10）／met＝条件を満たした */
function foilProg(c) {
  const words = list => {
    const ok = list.filter(w => stageOf(w.id) >= FOIL_STAGE).length, n = list.length;
    return { ok, n, met: n > 0 && ok >= n, on: n ? Math.floor(ok / n * 10) : 0, left: `あと ${n - ok} 語` };
  };
  if (c.ep) { const ep = EPS.find(e => e.id === c.ep); const r = words(ep ? epWords(ep) : []); return { ...r, label: `この話の${r.n}語` }; }
  if (c.ch) { const ch = CHAPTERS.find(x => x.id === c.ch); const r = words(ch && ch.eps ? chWords(ch) : []); return { ...r, label: `章の${r.n}語` }; }
  if (c.bonus) {
    const ch = CHAPTERS.find(x => x.id === c.bonus), rec = ch && S.chs[ch.id], n = ch && ch.eps ? Math.min(TEST_N, chWords(ch).length) : TEST_N;
    const best = rec ? rec.best || 0 : 0, met = !!rec && (!!rec.full || best >= n);
    return { met, on: met ? 10 : Math.floor(best / n * 10), label: '章末テストで満点', left: rec ? `最高 ${best}/${n}` : 'まだ受けていない' };
  }
  if (c.streak) {
    const goal = c.streak * 2, best = Math.max(S.bestStreak || 0, streak());
    return { met: best >= goal, on: Math.min(10, Math.floor(best / goal * 10)), label: `${goal}日つづける`, left: `あと ${Math.max(0, goal - best)} 日` };
  }
  if (c.words) {
    const ok = WORDS.filter(w => stageOf(w.id) >= FOIL_STAGE).length;
    return { met: ok >= c.words, on: Math.min(10, Math.floor(ok / c.words * 10)), label: `${c.words}語を定着`, left: `あと ${Math.max(0, c.words - ok)} 語` };
  }
  return { met: false, on: 0, label: '', left: '' };
}
/** 確認モードでは、手に入れたカードを全部箔押しで見せる（記録には残さない） */
const foilHas = id => DEV || !!S.foil[id];
/** 手に入れたカードのうち、新しく条件を満たしたものを箔押しにして記録する。新しく箔押しにした id を返す */
function foilCheck() {
  const got = CARDS.filter(c => S.cards[c.id] && !S.foil[c.id] && foilProg(c).met).map(c => c.id);
  if (!got.length) return [];
  got.forEach(id => { S.foil[id] = ymd(now()); });
  S.foilNew = [...new Set([...(S.foilNew || []), ...got])];
  save();
  return got;
}
function foilToast(ids, away) {
  const c = CARDS.find(x => x.id === ids[0]); if (!c) return;
  const who = ids.length > 1 ? `「${c.t}」ほか${ids.length - 1}枚` : `「${c.t}」`;
  toast(`${who}が箔押しになった。${away ? 'カードの画面で、裏の一言が読める' : '裏に一言が増えた'}`);
}
/** アルバムのカードの下：10の目盛りと「あと◯語」 */
function foilBarHTML(c) {
  const done = foilHas(c.id), p = done ? { on: 10, label: '', left: '' } : foilProg(c);
  return `<div class="fp"><p class="fp-t"><span>${done ? '' : esc(p.label)}</span><span${done ? ' class="fp-ok"' : ''}>${done ? '箔押し' : esc(p.left)}</span></p><p class="fp-bar" aria-hidden="true">${Array.from({ length: 10 }, (_, i) => `<i${i < p.on ? ' class="on"' : ''}></i>`).join('')}</p></div>`;
}

/** 陽太のノート。arg.ch＝その章の文の所から見せる */
VIEWS.note = (arg = {}) => {
  const NB = { it: null, mode: 'list', pool: [], picked: [], miss: 0, msg: '', ng: false, fresh: false, shake: false, scroll: arg.ch ? 'yn-' + arg.ch : '' };
  const start = it => { Object.assign(NB, { it, mode: 'puz', pool: shuffle([...noteToks(it.en), ...it.extra]).map((w, i) => ({ w, i })), picked: [], miss: 0, msg: '', ng: false, fresh: false }); };
  const itemHTML = it => {
    const st = noteState(it);
    const icon = st === 'done' ? 'check' : st === 'open' ? 'edit_note' : 'lock';
    const sub = st === 'done' ? `<span class="yn-en en">${esc(it.en)}</span>` : st === 'words' ? `<span class="yn-need">${esc(noteNeedText(it))}</span>` : '';

  };

    const h = `<h3 class="yn-ch" id="yn-${c.id}">${chName(c)}　${esc(c.title)}</h3>`;
    if (!noteChReady(c)) return `${h}<p class="yn-off"><span class="material-symbols-outlined" aria-hidden="true">lock</span> ${chName(c)}の話を全部読むと、${list.length}つ書ける</p>`;
    return `${h}<div class="yn-items">${list.map(itemHTML).join('')}</div>`;
  }).join('');
  const puzHTML = () => {
    const it = NB.it, need = noteToks(it.en);
    // 2回まちがえたら、次に置く語を1つ光らせる（ここまで合っているときだけ）
    const ok = NB.picked.every((p, k) => p.w === need[k]);
    const hint = NB.miss >= 2 && ok && NB.picked.length < need.length ? NB.pool.find(p => !NB.picked.includes(p) && p.w === need[NB.picked.length]) : null;
    return `<div class="yn-puz">
      <p class="yn-feel">陽太が言いたいこと</p>
      <p class="yn-ja-big">${esc(it.ja)}</p>
      <p class="yn-yv">${esc(it.yv)}</p>
      <div class="yn-slots" id="yn-slots" aria-label="組み立てた英文">${NB.picked.map(p => `<button class="yn-tile en" data-act="unpick" data-arg="${p.i}">${esc(p.w)}</button>`).join('') || '<span class="yn-ph">下の語を順に押して、英文を組み立てる（押した語をもう一度押すと戻る）</span>'}</div>
      <div class="yn-tiles">${NB.pool.map(p => { const used = NB.picked.includes(p); return `<button class="yn-tile en${used ? ' used' : ''}${p === hint ? ' hint' : ''}" data-act="pick" data-arg="${p.i}"${used ? ' disabled aria-hidden="true"' : ''}>${esc(p.w)}</button>`; }).join('')}</div>
      <div class="yn-row"><button class="btn" data-act="chk">これで書く</button><button class="btn ghost" data-act="clr">やり直す</button><span class="yn-s">使わない語もまざっている</span></div>
      <p class="yn-msg${NB.ng ? ' ng' : ''}" aria-live="polite">${esc(NB.msg)}</p>
    </div>`;
  };
  const saidHTML = () => {
    const it = NB.it;
    return `<div class="win yn-said${NB.fresh ? ' yn-in' : ''}"><span class="name yota">陽太</span>
        <p class="en yn-en-big">${esc(it.en)}</p>
        <p class="yn-line">${esc(it.ja)}</p>
        ${it.react.map(r => `<p class="yn-line${/^図書委員/.test(r) ? ' you' : ''}">${esc(r)}</p>`).join('')}
      </div>
      <div class="yn-row">${TTS.available() ? `<button class="btn ghost" data-act="say" data-arg="${esc(it.en)}" data-who="yota"><span class="material-symbols-outlined" aria-hidden="true">volume_up</span>英語を聞く</button>` : ''}<button class="btn ghost" data-act="again">もう一度組み立てる</button></div>
      <p class="yn-s">${NB.fresh ? '「陽太が言えたこと」に書きこまれた。透にはまだ渡さない。' : `書いた日　${esc(S.noteDone[it.id] || '')}`}</p>`;
  };
  const lockedHTML = () => {
    const it = NB.it, st = noteState(it);
    return `<div class="yn-puz"><p class="yn-feel">まだ開かない</p><p class="yn-ja-big">${esc(it.ja)}</p>
      <p class="yn-s">${st === 'ch' ? `${chName(it.ch)}の話を全部読むと開く。` : `${esc(noteNeedText(it))}。覚えたばかりの語は、次の復習で正解すると数に入る（段階3）。`}</p></div>`;
  };
  return {
    tab: 'story', scene: 'eve',
    where: () => (NB.it ? `陽太のノート ${NB.it.id}` : '陽太のノート'),
    html() {
      const done = NOTE_ALL.filter(it => S.noteDone[it.id]).length;
      const body = NB.mode === 'list' ? listHTML() : NB.mode === 'puz' ? puzHTML() : NB.mode === 'said' ? saidHTML() : lockedHTML();
      return `<section class="panel yn">${NB.mode === 'list' ? '' : '<button class="link" data-act="list">ノートの一覧へ</button>'}
        <div class="yn-nb"><h2 class="yn-h">陽太のノート</h2>
          <p class="yn-lead">透に、いつか英語で言いたいこと。……まだ渡さない。覚えた語だけで組み立てる。</p>
          <p class="yn-count">陽太が言えたこと　<b>${done}</b> / ${NOTE_ALL.length}</p>
          ${NB.mode === 'list' ? body : ''}</div>
        ${NB.mode === 'list' ? '' : body}</section>`;
    },
    after() {
      if (NB.scroll) { const el = document.getElementById(NB.scroll); if (el) el.scrollIntoView({ block: 'start' }); NB.scroll = ''; }
      if (NB.shake) { NB.shake = false; const s = $('#yn-slots'); if (s) s.classList.add('yn-shake'); }
    },
    act: {
      nopen(id) {
        const it = NOTE_ALL.find(x => x.id === id); if (!it) return;
        const st = noteState(it);
        if (st === 'done') Object.assign(NB, { it, mode: 'said', fresh: false });
        else if (st === 'open') start(it);
        else Object.assign(NB, { it, mode: 'locked' });

      },
      pick(i) { const p = NB.pool[Number(i)]; if (!p || NB.picked.includes(p)) return; NB.picked.push(p); NB.msg = ''; NB.ng = false; render(); },
      unpick(i) { NB.picked = NB.picked.filter(p => p.i !== Number(i)); NB.msg = ''; NB.ng = false; render(); },
      clr() { NB.picked = []; NB.msg = ''; NB.ng = false; render(); },

        }
        NB.miss++;
        // どこまで合っているかだけ伝える（答えは言わない）。合っている所までは残す
        let k = 0; while (k < got.length && got[k] === need[k]) k++;
        const m = !got.length ? 'まだ何も並んでいない。' : k === got.length ? `ここまでは合ってる（${k}語）。続きがある。` : `${k + 1}語目から、ちがう。`;
        if (k < got.length) NB.picked = NB.picked.slice(0, k);
        Object.assign(NB, { msg: m + (NB.miss >= 2 ? '　光っている語がヒント。' : ''), ng: true, shake: true });
        render();
      },
      again() { start(NB.it); render(); },
      list() { NB.scroll = NB.it ? 'yn-' + NB.it.ch.id : ''; Object.assign(NB, { it: null, mode: 'list' }); render(); },
    },
  };
};
