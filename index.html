/* =========================================================
   [S15] 検証用の入口（ブラウザのコンソールから）
   TT.lint() データの点検 / TT.shift(日数) 日をずらす / TT.answer(true|false) いまの問題に答える
   TT.stage(話・章・語の配列, 段階) 語の段階を変える / TT.yk() 陽太のノートと箔押しの今
   ========================================================= */
function lint() {
  const errs = [], ids = new Set();
  const epIndex = id => EPS.findIndex(e => e.id === id);
  WORDS.forEach(w => {
    if (ids.has(w.id)) errs.push(`単語の重複 ${w.id}`); ids.add(w.id);
    if ((w.ex.match(/\[[^\]]+\]/g) || []).length !== 1) errs.push(`${w.id}: 例文の [ ] が1つでない`);
    if ((w.exJa.match(/\{[^}]+\}/g) || []).length !== 1) errs.push(`${w.id}: 例文の訳の { } が1つでない`);
    if (!exForm(w).toLowerCase().startsWith(w.en.slice(0, 2).toLowerCase()) && formType(w) === 'other') errs.push(`${w.id}: 例文の [${exForm(w)}] が単語と合わない？`);
    if (epIndex(w.ep) < 0) errs.push(`${w.id}: 話 ${w.ep} が無い`);
  });
  const check = (lines, where, upto) => lines.forEach((L, i) => {
    if (L.k !== 'e') return;
    const en = [...L.en.matchAll(/\[([^\]|]+)(?:\|([^\]]+))?\]/g)].map(m => (m[2] || m[1]).toLowerCase());
    const ja = [...L.ja.matchAll(/\{([^}|]+)\|[^}]+\}/g)].map(m => m[1]);
    en.forEach(id => {
      if (!WMAP[id]) errs.push(`${where}#${i}: 英文の ${id} が単語に無い`);
      else if (epIndex(WMAP[id].ep) > upto) errs.push(`${where}#${i}: ${id} はこの先の話の単語`);
      if (!ja.includes(id)) errs.push(`${where}#${i}: 訳に ${id} の枠が無い`);
    });
    ja.forEach(id => { if (!en.includes(id)) errs.push(`${where}#${i}: 英文に ${id} の印が無い`); });
  });
  EPS.forEach((ep, k) => {
    const g = ep.lines.filter(L => L.k === 'gate').length;
    if (g !== 1) errs.push(`${ep.id}: ゲートが ${g} 個`);
    if (!epWords(ep).length) errs.push(`${ep.id}: 単語が0`);
    check(ep.lines, ep.id, k);
    const used = new Set(ep.lines.filter(L => L.k === 'e').flatMap(L => [...L.ja.matchAll(/\{([^}|]+)\|/g)].map(m => m[1])));
    epWords(ep).forEach(w => { if (!used.has(w.id)) errs.push(`${ep.id}: ${w.id} が物語に出てこない`); });
  });
  CHAPTERS.filter(c => c.bonus).forEach(c => check(c.bonus.lines, `${c.id}おまけ`, EPS.indexOf(c.eps[c.eps.length - 1])));
  // 話のはじめの札：どの話にも at（いつ・どこ）と sum（前回まで）。長すぎると札が縦に伸びる
  EPS.forEach(ep => {
    if (!ep.at) errs.push(`${ep.id}: いつ・どこ（at）が無い`);
    if (!ep.sum) errs.push(`${ep.id}: あらすじ（sum）が無い`);
    else if (ep.sum.length > 60) errs.push(`${ep.id}: あらすじが長い（${ep.sum.length}字・60字まで）`);
  });
  // 場面カード：id が重ならない・つながる話や章がある・どの話と章とおまけにも1枚・モチーフのアイコンを読みこんでいる
  const iconLink = document.querySelector('link[href*="icon_names="]');
  const icons = iconLink ? (iconLink.getAttribute('href').match(/icon_names=([^&"]+)/) || ['', ''])[1].split(',') : [];
  const cids = new Set();
  CARDS.forEach(c => {
    if (cids.has(c.id)) errs.push(`カード ${c.id}: id が重なる`); cids.add(c.id);
    if (c.ep && !EPS.some(e => e.id === c.ep)) errs.push(`カード ${c.id}: 話 ${c.ep} が無い`);
    if (c.ch && !CHAPTERS.some(x => x.id === c.ch && x.eps)) errs.push(`カード ${c.id}: 章 ${c.ch} が無い`);
    if (c.bonus && !CHAPTERS.some(x => x.id === c.bonus && x.bonus)) errs.push(`カード ${c.id}: おまけ ${c.bonus} が無い`);
    if (!['eve', 'day', 'dusk', 'rain', 'night'].includes(c.bg)) errs.push(`カード ${c.id}: 場面の色 ${c.bg} が無い`);
    if (!icons.includes(c.mo)) errs.push(`カード ${c.id}: モチーフ ${c.mo} を head の icon_names に足していない`);
    ['t', 'q', 'cap'].forEach(k => { if (!c[k]) errs.push(`カード ${c.id}: ${k} が無い`); });
  });
  EPS.forEach(ep => { if (!CARDS.some(c => c.ep === ep.id)) errs.push(`${ep.id}: 場面カードが無い`); });
  CHAPTERS.filter(ch => ch.eps).forEach(ch => {
    if (!CARDS.some(c => c.ch === ch.id)) errs.push(`${ch.id}: 章のカードが無い`);
    if (ch.bonus && !CARDS.some(c => c.bonus === ch.id)) errs.push(`${ch.id}: おまけのカードが無い`);
  });
  // キュン：どの話にも1つ以上・いちばんの場面（2）は1つだけ・関門には付けない
  [...EPS.map(ep => [ep.id, ep.lines]), ...CHAPTERS.filter(c => c.bonus).map(c => [`${c.id}おまけ`, c.bonus.lines])].forEach(([where, lines]) => {
    if (!kyLines(lines).length) errs.push(`${where}: キュンが0`);
    if (lines.filter(L => L.ky === 2).length !== 1) errs.push(`${where}: いちばんのキュン（2）が1つでない`);
    lines.forEach((L, i) => { if ((L.ky || L.big) && !['n', 'v', 's', 'e'].includes(L.k)) errs.push(`${where}#${i}: キュン・要所の印がセリフでない行に付いている`); });
  });
  Object.entries(NYUSHI).forEach(([cid, list]) => {
    const c = CHAPTERS.find(x => x.id === cid);
    if (!c || !c.eps) { errs.push(`入試の形 ${cid}: 章が無い`); return; }
    list.forEach((n, i) => {
      const where = `入試の形 ${cid}#${i}(${n.t})`;
      if (!WMAP[n.w]) errs.push(`${where}: 単語 ${n.w} が無い`);
      else if (!chWords(c).includes(WMAP[n.w])) errs.push(`${where}: ${n.w} はこの章の単語でない`);
      if (!n.ja) errs.push(`${where}: 訳 ja が無い`);
      if (n.t === 'resp') { if (!Array.isArray(n.choices) || n.choices.length !== 4 || !(n.ans >= 0 && n.ans < 4)) errs.push(`${where}: 選択肢か答えがおかしい`); if (!n.audio) errs.push(`${where}: 放送文が無い`); return; }
      if ((n.q.match(/\[[^\]]+\]/g) || []).length !== 1) { errs.push(`${where}: [ ] が1つでない`); return; }
      const a = ansOf(n.q).toLowerCase();
      if (!a.startsWith(n.w.slice(0, 2))) errs.push(`${where}: 答え ${a} が単語 ${n.w} と合わない？`);
      if (n.t === 'gform' && (n.g.length !== 4 || !n.g.includes(a))) errs.push(`${where}: 語群が4語でないか、答えが無い`);
      if (n.t === 'lmemo' && !n.audio.toLowerCase().includes(a)) errs.push(`${where}: 放送文に答え ${a} が出てこない`);
    });
  });
  WORDS.forEach(w => { const g = pickGroup(w); if (g.length !== 4) errs.push(`${w.id}: 語群が4語そろわない`); });
  // 箔押しの裏の一言：どのカードにも foil（一言はカードの行に書くので、カードの無い id は生まれない）
  CARDS.forEach(c => { if (typeof c.foil !== 'string' || !c.foil.trim()) errs.push(`カード ${c.id}: 箔押しの裏の一言（foil）が無い`); });
  // 陽太のノート：どの章にも5文・id が重ならない・答えの語はその章までの語・まざる語で別の正解が生まれない
  ['check', 'edit_note', 'lock', 'volume_up'].forEach(n => { if (!icons.includes(n)) errs.push(`陽太のノート: アイコン ${n} を head の icon_names に足していない`); });
  CHAPTERS.filter(ch => ch.eps).forEach(ch => { if (!YOTA_NOTE[ch.id]) errs.push(`${ch.id}: 陽太のノートの文が無い`); });
  const nids = new Set();
  Object.entries(YOTA_NOTE).forEach(([cid, list]) => {
    const c = CHAPTERS.find(x => x.id === cid);
    if (!c || !c.eps) { errs.push(`陽太のノート ${cid}: 章が無い`); return; }
    if (list.length !== 5) errs.push(`陽太のノート ${cid}: 文が ${list.length} つ（1章に5文）`);
    const upto = EPS.indexOf(c.eps[c.eps.length - 1]);
    list.forEach(it => {
      const where = `陽太のノート ${it.id}`;
      if (nids.has(it.id)) errs.push(`${where}: id が重なる`); nids.add(it.id);
      ['ja', 'yv', 'en'].forEach(k => { if (!it[k]) errs.push(`${where}: ${k} が無い`); });
      if (!Array.isArray(it.react) || it.react.length !== 2) errs.push(`${where}: react が2行でない`);
      if (!Array.isArray(it.extra) || !it.extra.length) { errs.push(`${where}: まざる語（extra）が無い`); return; }
      const toks = noteToks(it.en || '');
      toks.forEach(t => {
        const w = lemmaOf(t);
        if (w && epIndex(w.ep) > upto) errs.push(`${where}: ${t}（見出し ${w.en}）は先の章（${chName(EPS[epIndex(w.ep)].ch)}）の単語`);
      });
      it.extra.forEach(x => {
        // 答え合わせは札の文字で比べる。同じ語が答えにもあるときは札が1枚多いだけで、どちらの札を使っても同じ文字になる（個数で区別できる）
        const same = toks.find(t => t.toLowerCase() === x.toLowerCase());
        if (same && same !== x) errs.push(`${where}: まざる語 ${x} が答えの ${same} と大文字・小文字だけちがう（同じ並びでも不正解になる）`);
        // まざる語を答えの語と入れかえても、意味の近い文になる（NEAR の組）と、正しい英文なのに不正解になる
        // （答えにある語の形ちがい＝calls と call は、入れかえの相手ではないので見ない）
        const a = lemmaOf(x), lem = toks.map(lemmaOf);
        if (a && !lem.includes(a)) lem.forEach((b, j) => { const t = toks[j]; if (b && a !== b && isNear(a.id, b.id)) errs.push(`${where}: まざる語 ${x} を ${t} と入れかえても文になる（意味の近い組 NEAR）`); });
      });
    });
  });
  return errs;
}
window.TT = {
  get S() { return S; }, WORDS, CHAPTERS, lint,
  view: () => VIEW && VIEW.name,
  shift(days) { TIME_SHIFT += days; go(VIEW && VIEW.focus ? 'home' : (VIEW ? VIEW.name : 'home')); return ymd(now()); },
  q() { if (!VIEW || VIEW.name !== 'quiz') return null; const it = VIEW.Q.items[VIEW.Q.i]; return { id: it.id, fmt: it.fmt, done: it.done, i: VIEW.Q.i, n: VIEW.Q.items.length }; },
  /** いまの画面を1つ進める（問題なら ok で正解/まちがいを答える。答えたあとなら次へ） */
  answer(ok = true) {
    const v = VIEW; if (!v) return null;
    if (v.name === 'quiz') {
      const it = v.Q.items[v.Q.i];
      if (it.done) v.act.next();
      else if (v.spec().type === 'write') { const inp = $('#sp'); inp.value = ok ? v.spec().ans[0] : 'zzz'; v.submit(); }
      else v.act.choose(it.choices.findIndex(c => c.ok === ok));
    } else if (v.name === 'lesson') v.act.cnext();
    else if (v.name === 'reader') { if (v.act.next) v.act.next(); }
    else if (v.name === 'result') v.act.rb(0);
    return v.name;
  },
  /** 正解で n 回進める */
  run(n = 1, ok = true) { let last; for (let k = 0; k < n; k++) last = this.answer(ok); return VIEW.name; },
  reset() { try { localStorage.removeItem(KEY); } catch (e) { /* なにもしない */ } S = DEFAULT(); TIME_SHIFT = 0; go('home'); },
  /** 語の段階をまとめて変える（やり込みの確かめ用）。TT.stage('1-1', 4)＝その話の語／TT.stage('c1', 3)＝その章の語／TT.stage(['again', 'next'], 3) */
  stage(target, s) {
    const ch = CHAPTERS.find(c => c.id === target && c.eps), ep = EPS.find(e => e.id === target);
    const ids = Array.isArray(target) ? target : ch ? chWords(ch).map(w => w.id) : ep ? epWords(ep).map(w => w.id) : [target];
    const bad = ids.filter(id => !WMAP[id]); if (bad.length) return `単語帳に無い：${bad.join('・')}`;
    ids.forEach(id => setStage(id, s)); save(); go(VIEW && VIEW.focus ? 'home' : (VIEW ? VIEW.name : 'home'));
    return `${ids.length}語を段階${s}にした`;
  },
  /** やり込みの今：ノートの文ごとの状態（足りない語）と、手に入れたカードの箔押しの進み */
  yk() {
    return {
      note: Object.fromEntries(NOTE_ALL.map(it => { const st = noteState(it); return [it.id, st === 'words' ? `words：${noteNeed(it).map(w => w.en).join('・')}` : st]; })),
      foil: Object.fromEntries(CARDS.filter(c => S.cards[c.id]).map(c => { const p = foilProg(c); return [c.id, S.foil[c.id] ? `箔（${S.foil[c.id]}）` : `${p.label}：${p.left}`]; })),
    };
  },
  errors: () => LOGS.filter(l => / error /.test(l)),
};

/* =========================================================
   [S16] 起動
   ========================================================= */
/** 場面の部品（窓・光・本棚・雨・灯り）。どれを出すかは CSS が場面ごとに決める */
(function buildScene() {
  const sc = $('#scene');
  let shelf = '';
  for (let row = 0; row < 2; row++) {
    for (let i = 0; i < 22; i++) shelf += `<i style="width:${6 + ((i + row * 5) * 7) % 7}px;height:${48 + ((i + row * 3) * 13) % 20}px"></i>`;
    shelf += '<b></b>';
  }
  sc.innerHTML = `<div class="lamp"></div><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div><div class="sash"></div><div class="shelf">${shelf}</div><div class="rain"></div>`;
})();
try {
  load();
  TTS.init();
  go('home');
  const bad = lint();
  if (bad.length) console.warn('データの点検で見つかったこと', bad);
} catch (e) {
  console.error(e);
  app.innerHTML = `<section class="box"><h2>起動できなかった</h2><p class="note">設定のデバッグログ、またはこの文を先生に送る：${esc(e.message)}</p></section>`;
}
</script>
